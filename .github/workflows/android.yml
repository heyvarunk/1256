name: Build Android WebView APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Isolated clean Gradle build pipeline container configuration
    - name: Setup Gradle Runtime environment
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.5

    - name: Generate Clean Android Architecture Files
      run: |
        mkdir -p app/src/main/java/com/example/myapp
        mkdir -p app/src/main/res/layout
        
        # 1. Create Manifest Permissions (Strict Android 14+ standalone syntax rules)
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://android.com">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application 
                android:label="Varun ERP" 
                android:hardwareAccelerated="true"
                android:theme="@android:style/Theme.Material.Light.NoActionBar">
                <activity android:name="com.example.myapp.MainActivity" android:exported="true" android:configChanges="orientation|screenSize">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 2. Create Layout View Frame
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <RelativeLayout xmlns:android="http://android.com" android:layout_width="match_parent" android:layout_height="match_parent">
            <WebView android:id="@+id/webview" android:layout_width="match_parent" android:layout_height="match_parent" />
        </RelativeLayout>
        EOF

        # 3. Create Main Java Logic File pointing to your deployed site URL
        cat << 'EOF' > app/src/main/java/com/example/myapp/MainActivity.java
        package com.example.myapp;
        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import android.webkit.WebChromeClient;
        import android.app.Activity;

        public class MainActivity extends Activity {
            private WebView myWebView;
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);
                myWebView = (WebView) findViewById(R.id.webview);
                
                WebSettings settings = myWebView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setDatabaseEnabled(true);
                settings.setAllowFileAccess(true);
                settings.setLoadsImagesAutomatically(true);
                settings.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
                
                settings.setUseWideViewPort(true);
                settings.setLoadWithOverviewMode(true);
                
                myWebView.setWebViewClient(new WebViewClient());
                myWebView.setWebChromeClient(new WebChromeClient());
                
                // Embedded Deployed Application Public Link
                myWebView.loadUrl("https://github.io");
            }
            @Override
            public void onBackPressed() {
                if (myWebView.canGoBack()) { myWebView.goBack(); } else { super.onBackPressed(); }
            }
        }
        EOF

        # 4. Create Standard Build Gradle Settings assets
        echo "include ':app'" > settings.gradle
        
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.2'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF
        
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.example.myapp'
            compileSdk 34
            defaultConfig {
                applicationId 'com.example.myapp'
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName '1.0'
            }
        }
        EOF

    - name: Build Android Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Upload Downloadable APK File
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: app/build/outputs/apk/debug/app-debug.apk
