name: Build Android WebView APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Lightweight Android Project
      run: |
        mkdir -p app/src/main/java/com/example/myapp
        mkdir -p app/src/main/res/layout
        
        # 1. Create Manifest Permissions
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.myapp">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:label="My Web App" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 2. Create Layout View
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent">
            <WebView android:id="@+id/webview" android:layout_width="match_parent" android:layout_height="match_parent" />
        </RelativeLayout>
        EOF

        # 3. Create Main Java Logic File using standard Activity
        cat << 'EOF' > app/src/main/java/com/example/myapp/MainActivity.java
        package com.example.myapp;
        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import android.app.Activity;

        public class MainActivity extends Activity {
            private WebView myWebView;
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);
                myWebView = (WebView) findViewById(R.id.webview);
                WebSettings webSettings = myWebView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                myWebView.setWebViewClient(new WebViewClient());
                
                // CHANGE THIS URL TO YOUR DEPLOYED SITE:
                myWebView.loadUrl("https://your-deployed-website.com");
            }
            @Override
            public void onBackPressed() {
                if (myWebView.canGoBack()) { myWebView.goBack(); } else { super.onBackPressed(); }
            }
        }
        EOF

        # 4. Create Basic Gradle Settings
        echo "include ':app'" > settings.gradle
        
        printf "buildscript {\n    repositories {\n        google()\n        mavenCentral()\n    }\n    dependencies {\n        classpath 'com.android.tools.build:gradle:8.1.1'\n    }\n}\nallprojects {\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\n" > build.gradle
        
        printf "plugins {\n    id 'com.android.application'\n}\nandroid {\n    namespace 'com.example.myapp'\n    compileSdk 34\n    defaultConfig {\n        applicationId 'com.example.myapp'\n        minSdk 24\n        targetSdk 34\n        versionCode 1\n        versionName '1.0'\n    }\n}\n" > app/build.gradle

    - name: Setup Gradle Wrapper Environment
      run: gradle wrapper --gradle-version 8.1.1

    - name: Build Android Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Downloadable APK File
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: app/build/outputs/apk/debug/app-debug.apk
