                setContent('');
            };
            return (
                <div className="space-y-6 pb-20 animate-fade-in">
                    <header><h2 className="text-2xl font-semibold text-[#323130]">End of Day Reports</h2></header>
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="bg-white p-6 rounded shadow-sm border border-[#edebe9]">
                            <h3 className="font-semibold text-[#323130] mb-4">Submit Report</h3>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <textarea className="w-full border border-[#8a8886] p-3 rounded h-40 resize-none text-base bg-white focus:ring-2 focus:ring-[#0078d4] transition-colors" placeholder="Work done today..." value={content} onChange={e => setContent(e.target.value)} />
                                <button className="w-full bg-[#0078d4] hover:bg-[#106ebe] text-white py-2 rounded text-sm font-semibold shadow-sm">Submit</button>
                            </form>
                        </div>
                        <div className="lg:col-span-2 bg-white rounded shadow-sm border border-[#edebe9] p-4 h-[500px] overflow-auto space-y-4">
                            <h3 className="font-semibold text-[#323130]">Team Submissions</h3>
                            {reports.map(r => (
                                <div key={r.id} className="bg-[#faf9f8] p-4 rounded border border-[#edebe9]">
                                    <div className="flex justify-between mb-2">
                                        <span className="font-semibold text-sm text-[#0078d4]">{r.userName}</span>
                                        <span className="text-xs text-[#605e5c]">{r.date}</span>
                                    </div>
                                    <p className="text-sm text-[#323130] whitespace-pre-wrap">{r.content}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // Chat uses the EXISTING Firestore messages collection. No client or attendance records are changed.
        const ChatModule = ({ user, allUsers, messages, onSendMessage, chatError }) => {
            const [text, setText] = useState('');
            const [activeChat, setActiveChat] = useState('group');
            const [sidebarOpen, setSidebarOpen] = useState(true);
            const [busy, setBusy] = useState(false);
            const [error, setError] = useState('');
            const [search, setSearch] = useState('');
            const [unreadSeen, setUnreadSeen] = useState({});
            const fileInputRef = useRef(null);
            const bottomRef = useRef(null);
            const myIds = [user.uid, user.docId].filter(Boolean);
            const identity = u => u.uid || (u.id === 'admin_master' ? u.uid : u.id);
            const others = allUsers.filter(u => u.email !== user.email && !myIds.includes(identity(u)))
                .filter(u => (u.name || u.email || '').toLowerCase().includes(search.toLowerCase()));
            const recipient = allUsers.find(u => identity(u) === activeChat || u.id === activeChat);
            const recipientIds = recipient ? [recipient.uid, recipient.id].filter(Boolean) : [activeChat];
            const belongs = m => {
                if (activeChat === 'group') return !m.recipientId || m.recipientId === 'group';
                return (myIds.includes(m.userId) && recipientIds.includes(m.recipientId)) ||
                       (recipientIds.includes(m.userId) && myIds.includes(m.recipientId));
            };
            const activeMessages = messages.filter(belongs);
            const messageTime = m => m.timestamp?.toMillis ? m.timestamp.toMillis() : 0;
            const switchChat = id => { setActiveChat(id); setSidebarOpen(false); setError(''); setUnreadSeen(v => ({...v,[id]:Date.now()})); };
            useEffect(() => { bottomRef.current?.scrollIntoView({behavior:'auto'}); }, [messages.length,activeChat]);
            const handleSend = async e => {
                e.preventDefault();
                if (!text.trim() || busy) return;
                setBusy(true); setError('');
                try {
                    await onSendMessage({text:text.trim(),type:'text',userId:user.uid,userName:user.name,userPhoto:user.photoURL||'',
                        recipientId:activeChat==='group'?null:activeChat,timestamp:serverTimestamp()});
                    setText('');
                } catch(err) {setError('Message not sent: '+err.message);} finally {setBusy(false);}
            };
            const handleFileSelect = async e => {
                const file=e.target.files?.[0]; if(!file)return;
                if(file.type!=='application/pdf'||file.size>500*1024){setError('PDF only, maximum 500 KB.');e.target.value='';return;}
                setBusy(true);setError('');
                try {
                    const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});
                    await onSendMessage({text:'Shared a PDF file',type:'pdf',fileName:file.name,fileData:data,userId:user.uid,userName:user.name,
                        userPhoto:user.photoURL||'',recipientId:activeChat==='group'?null:activeChat,timestamp:serverTimestamp()});
                } catch(err){setError('File not sent: '+err.message);}finally{setBusy(false);e.target.value='';}
            };
            return <div className="h-[calc(100vh-140px)] md:h-[calc(100vh-100px)] flex bg-white rounded shadow-sm border overflow-hidden relative">
                <aside className={`${sidebarOpen?'absolute md:static z-20 h-full':'hidden md:flex'} w-full md:w-72 shrink-0 border-r bg-[#faf9f8] flex flex-col`}>
                    <div className="p-4 border-b bg-white font-semibold flex items-center gap-2"><Lucide.MessageSquare size={18}/> Messages</div>
                    <div className="p-3"><input className="border rounded p-2 w-full text-sm" placeholder="Find a colleague" value={search} onChange={e=>setSearch(e.target.value)}/></div>
                    <div className="flex-1 overflow-auto p-3 space-y-1">
                        <button onClick={()=>switchChat('group')} className={`w-full text-left rounded p-3 flex gap-2 items-center ${activeChat==='group'?'bg-[#eff6fc] text-[#0078d4]':'hover:bg-[#edebe9]'}`}><Lucide.Users size={18}/> Team Group Chat</button>
                        <p className="text-xs font-bold text-[#605e5c] uppercase pt-4 pb-2">Direct messages</p>
                        {others.map(u=>{const id=identity(u);const unseen=messages.filter(m=>m.userId===id&&myIds.includes(m.recipientId)&&messageTime(m)>(unreadSeen[id]||0)).length;
                            return <button key={u.id} onClick={()=>switchChat(id)} className={`w-full text-left rounded p-3 flex items-center justify-between gap-2 ${activeChat===id?'bg-[#eff6fc] text-[#0078d4]':'hover:bg-[#edebe9]'}`}>
                                <span className="truncate">{u.name||u.email}</span>{unseen>0&&<span className="text-xs bg-[#0078d4] text-white rounded-full px-2">{unseen}</span>}
                            </button>;})}
                        {!others.length&&<p className="text-sm text-[#605e5c]">No colleagues found.</p>}
                    </div>
                </aside>
                <section className="flex-1 min-w-0 flex flex-col">
                    <header className="p-4 border-b font-semibold flex items-center gap-3">
                        <button type="button" onClick={()=>setSidebarOpen(true)} className="md:hidden"><Lucide.Menu size={20}/></button>
                        {activeChat==='group'?<><Lucide.Users size={19}/> Team Group Chat</>:(recipient?.name||recipient?.email||'Direct Message')}
                    </header>
                    {(error||chatError)&&<div role="alert" className="bg-[#fde7e9] text-[#a4262c] p-3 text-sm">{error||chatError}</div>}
                    <div className="flex-1 overflow-y-auto p-4 space-y-3 bg-[#faf9f8]">
                        {activeMessages.map(m=><div key={m.id} className={`flex ${myIds.includes(m.userId)?'justify-end':'justify-start'}`}>
                            <div className={`max-w-[85%] md:max-w-[70%] rounded p-3 shadow-sm text-sm ${myIds.includes(m.userId)?'bg-[#0078d4] text-white':'bg-white border'}`}>
                                <div className="text-xs font-semibold mb-1">{m.userName||'Employee'} <span className="font-normal opacity-70">{m.timestamp?.toDate?m.timestamp.toDate().toLocaleString():''}</span></div>
                                {m.type==='pdf'&&m.fileData?<a className="underline" href={m.fileData} download={m.fileName||'attachment.pdf'}>Download {m.fileName||'PDF'}</a>:<p className="whitespace-pre-wrap break-words">{m.text}</p>}
                            </div>
                        </div>)}
                        {!activeMessages.length&&<p className="text-center text-[#605e5c] p-8">No messages yet. Start a conversation.</p>}
                        <div ref={bottomRef}/>
                    </div>
                    <form onSubmit={handleSend} className="p-3 border-t flex items-center gap-2">
                        <input ref={fileInputRef} type="file" accept="application/pdf" className="hidden" onChange={handleFileSelect}/>
                        <button type="button" disabled={busy} onClick={()=>fileInputRef.current?.click()} className="p-2 bg-[#f3f2f1] rounded" title="Attach PDF"><Lucide.Paperclip size={20}/></button>
                        <input value={text} onChange={e=>setText(e.target.value)} placeholder={activeChat==='group'?'Message the team':'Private message'} className="min-w-0 flex-1 border rounded p-2 text-base" />
                        <button type="submit" disabled={busy||!text.trim()} className="bg-[#0078d4] disabled:opacity-50 text-white rounded p-2"><Lucide.Send size={20}/></button>
                    </form>
                </section>
            </div>;
        };

        const ProgressModule = ({ user, tasks, attendanceLogs, reports }) => {
            const myTasks = tasks.filter(t => t.assignee === user.name);
            const completed = myTasks.filter(t => t.status === 'done').length;
            const total = myTasks.length;
            const progress = total === 0 ? 0 : Math.round((completed / total) * 100);
            const presentDays = attendanceLogs.filter(l => l.userId === user.uid && l.type === 'IN').length;

            return (
                <div className="space-y-6 pb-20 animate-fade-in">
                    <header><h2 className="text-2xl font-semibold text-[#323130]">My Progress</h2></header>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="bg-white p-6 rounded shadow-sm border border-[#edebe9] relative overflow-hidden">
                            <h3 className="text-[#605e5c] text-xs font-semibold uppercase mb-2 relative z-10">Task Efficiency</h3>
                            <div className="flex items-end gap-2 mb-2 relative z-10">
                                <span className="text-4xl font-semibold text-[#0078d4]">{progress}%</span>
                            </div>
                            <div className="w-full bg-[#f3f2f1] rounded h-2 relative z-10 border border-[#edebe9]">
                                <div className="bg-[#0078d4] h-2 rounded transition-all duration-1000" style={{width: `${progress}%`}}></div>
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded shadow-sm border border-[#edebe9]">
                            <h3 className="text-[#605e5c] text-xs font-semibold uppercase mb-2">Attendance Streak</h3>
                            <div className="flex items-center gap-3">
                                <div className="p-3 bg-[#dff6dd] text-[#107c10] rounded"><Lucide.CalendarCheck size={24} /></div>
                                <div><span className="text-2xl font-semibold text-[#323130]">{presentDays}</span><p className="text-xs text-[#605e5c]">Days Present</p></div>
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded shadow-sm border border-[#edebe9]">
                            <h3 className="text-[#605e5c] text-xs font-semibold uppercase mb-2">Reports Submitted</h3>
                            <div className="flex items-center gap-3">
                                <div className="p-3 bg-[#eff6fc] text-[#0078d4] rounded"><Lucide.FileText size={24} /></div>
                                <div><span className="text-2xl font-semibold text-[#323130]">{reports.filter(r => r.userId === user.uid).length}</span><p className="text-xs text-[#605e5c]">EODs Filed</p></div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const IdeaHubModule = ({ user, ideas, onSubmitIdea }) => {
            const [title, setTitle] = useState('');
            const [desc, setDesc] = useState('');
            const [category, setCategory] = useState('Process Improvement');

            const handleSubmit = (e) => {
                e.preventDefault();
                if(!title || !desc) return;
                onSubmitIdea({ title, description: desc, category, userId: user.uid, userName: user.name, votes: 0, timestamp: serverTimestamp() });
                setTitle(''); setDesc('');
            };

            return (
                <div className="space-y-6 pb-20 animate-fade-in">
                    <header>
                        <h2 className="text-2xl font-semibold text-[#323130]">Idea Hub</h2>
                        <p className="text-[#605e5c]">Work Process Idea Center</p>
                    </header>
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="bg-white p-6 rounded shadow-sm border border-[#edebe9]">
                            <h3 className="font-semibold text-[#323130] mb-4 flex items-center gap-2"><Lucide.Lightbulb size={18} className="text-[#d83b01]"/> Submit Idea</h3>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <input type="text" className="w-full border border-[#8a8886] p-2 rounded text-base focus:ring-2 focus:ring-[#0078d4]" placeholder="Title" value={title} onChange={e=>setTitle(e.target.value)} required />
                                <select className="w-full border border-[#8a8886] p-2 rounded text-base bg-white focus:ring-2 focus:ring-[#0078d4]" value={category} onChange={e=>setCategory(e.target.value)}>
                                    <option>Process Improvement</option><option>Cost Saving</option><option>Culture</option><option>Safety</option>
                                </select>
                                <textarea className="w-full border border-[#8a8886] p-2 rounded text-base h-32 resize-none focus:ring-2 focus:ring-[#0078d4]" placeholder="Description..." value={desc} onChange={e=>setDesc(e.target.value)} required></textarea>
                                <button className="w-full bg-[#0078d4] hover:bg-[#106ebe] text-white py-2 rounded font-semibold shadow-sm">Submit</button>
                            </form>
                        </div>
                        <div className="lg:col-span-2 space-y-4">
                            {ideas.map(idea => (
                                <div key={idea.id} className="bg-white p-5 rounded shadow-sm border border-[#edebe9] hover:border-[#c8c6c4] transition-all">
                                    <div className="flex justify-between items-start mb-2"><span className="bg-[#f3f2f1] text-[#323130] border border-[#edebe9] text-xs px-2 py-1 rounded font-semibold">{idea.category}</span><span className="text-xs text-[#605e5c]">{idea.userName}</span></div>
                                    <h4 className="font-semibold text-[#323130] text-lg mb-1">{idea.title}</h4>
                                    <p className="text-[#605e5c] text-sm">{idea.description}</p>
                                </div>
                            ))}
                            {ideas.length === 0 && <div className="text-center py-10 text-[#605e5c]">No ideas yet. Share yours!</div>}
                        </div>
                    </div>
                </div>
            );
        };

        const MeetingsModule = ({ user, meetings, onScheduleMeeting, onDeleteMeeting }) => {
            const [title, setTitle] = useState('');
            const [date, setDate] = useState('');
            const [time, setTime] = useState('');
            const [link, setLink] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                if(!title || !date || !time) return;
                onScheduleMeeting({ title, date, time, link, hostId: user.uid, hostName: user.name, timestamp: serverTimestamp() });
                setTitle(''); setDate(''); setTime(''); setLink('');
            };

            return (
                <div className="space-y-6 pb-20 animate-fade-in">
                    <header>
                        <h2 className="text-2xl font-semibold text-[#323130]">Meeting Scheduler</h2>
                        <p className="text-[#605e5c] text-sm">Organize and join team meetings.</p>
                    </header>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="bg-white p-6 rounded shadow-sm border border-[#edebe9]">
                            <h3 className="font-semibold text-[#323130] mb-4">Schedule a Meeting</h3>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div>
                                    <label className="text-xs font-semibold text-[#605e5c]">Topic / Title</label>
                                    <input type="text" className="w-full border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4] mt-1" value={title} onChange={e=>setTitle(e.target.value)} required />
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="text-xs font-semibold text-[#605e5c]">Date</label>
                                        <input type="date" className="w-full border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4] mt-1" value={date} onChange={e=>setDate(e.target.value)} required />
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-[#605e5c]">Time</label>
                                        <input type="time" className="w-full border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4] mt-1" value={time} onChange={e=>setTime(e.target.value)} required />
                                    </div>
                                </div>
                                <div>
                                    <label className="text-xs font-semibold text-[#605e5c]">Meeting Link / Room</label>
                                    <input type="text" className="w-full border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4] mt-1" placeholder="e.g. Teams, Zoom, or Room 4A" value={link} onChange={e=>setLink(e.target.value)} />
                                </div>
                                <button className="w-full bg-[#0078d4] text-white py-2 rounded font-semibold hover:bg-[#106ebe] shadow-sm mt-2">Schedule</button>
                            </form>
                        </div>

                        <div className="lg:col-span-2 bg-white rounded shadow-sm border border-[#edebe9] overflow-hidden">
                            <div className="p-4 bg-[#f3f2f1] border-b border-[#edebe9] font-semibold text-[#323130]">Upcoming Meetings</div>
                            <div className="p-4 space-y-4 max-h-[500px] overflow-y-auto">
                                {meetings.map(meet => (
                                    <div key={meet.id} className="border border-[#edebe9] p-4 rounded flex justify-between items-start hover:border-[#0078d4] transition-colors relative group">
                                        {(user.role === 'Admin' || meet.hostId === user.uid) && (
                                            <button onClick={()=>onDeleteMeeting(meet.id)} className="absolute top-4 right-4 text-[#a19f9d] hover:text-[#a4262c] opacity-0 group-hover:opacity-100 transition-opacity"><Lucide.Trash2 size={16}/></button>
                                        )}
                                        <div className="flex gap-4">
                                            <div className="flex flex-col items-center justify-center bg-[#eff6fc] text-[#0078d4] p-3 rounded min-w-[70px]">
                                                <span className="text-xs font-bold uppercase">{new Date(meet.date).toLocaleString('default', { month: 'short' })}</span>
                                                <span className="text-2xl font-bold leading-none">{new Date(meet.date).getDate()}</span>
                                            </div>
                                            <div>
                                                <h4 className="font-semibold text-lg text-[#323130] pr-6">{meet.title}</h4>
                                                <div className="flex items-center gap-3 text-sm text-[#605e5c] mt-1">
                                                    <span className="flex items-center gap-1"><Lucide.Clock size={14}/> {meet.time}</span>
                                                    <span className="flex items-center gap-1"><Lucide.User size={14}/> {meet.hostName}</span>
                                                </div>
                                                {meet.link && (
                                                    <a href={meet.link.startsWith('http') ? meet.link : `https://${meet.link}`} target="_blank" rel="noreferrer" className="text-[#0078d4] text-sm font-semibold mt-2 inline-flex items-center gap-1 hover:underline">
                                                        <Lucide.Video size={14}/> Join Meeting
                                                    </a>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                                {meetings.length === 0 && <div className="text-center py-10 text-[#605e5c]">No upcoming meetings scheduled.</div>}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const TrainingModule = ({ user, trainings, onAddTraining, onMarkComplete, onDeleteTraining }) => {
            const [title, setTitle] = useState('');
            const [desc, setDesc] = useState('');
            const [link, setLink] = useState('');
            
            const handleAdd = (e) => {
                e.preventDefault();
                if(!title || !link) return;
                onAddTraining({ title, description: desc, link, addedBy: user.name, completions: [], timestamp: serverTimestamp() });
                setTitle(''); setDesc(''); setLink('');
            };

            return (
                <div className="space-y-6 pb-20 animate-fade-in">
                    <header>
                        <h2 className="text-2xl font-semibold text-[#323130]">Learning & Training Hub</h2>
                        <p className="text-[#605e5c] text-sm">Enhance your skills with company resources.</p>
                    </header>

                    {user.role === 'Admin' && (
                        <div className="bg-white p-6 rounded shadow-sm border border-[#edebe9]">
                            <h3 className="font-semibold text-[#323130] mb-4">Add Training Resource</h3>
                            <form onSubmit={handleAdd} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <input type="text" className="border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4]" placeholder="Course Title" value={title} onChange={e=>setTitle(e.target.value)} required />
                                <input type="url" className="border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4]" placeholder="Resource Link (Video/Doc)" value={link} onChange={e=>setLink(e.target.value)} required />
                                <div className="md:col-span-2 flex gap-4 items-end">
                                    <input type="text" className="flex-1 border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4]" placeholder="Short Description..." value={desc} onChange={e=>setDesc(e.target.value)} />
                                    <button className="bg-[#107c10] text-white px-6 py-2 rounded font-semibold hover:bg-[#0b5a0b] shadow-sm">Publish Course</button>
                                </div>
                            </form>
                        </div>
                    )}

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {trainings.map(t => {
                            const isCompleted = t.completions && t.completions.includes(user.uid);
                            return (
                                <div key={t.id} className="bg-white p-5 rounded shadow-sm border border-[#edebe9] hover:border-[#0078d4] transition-all flex flex-col relative group">
                                    {user.role === 'Admin' && (
                                        <button onClick={()=>onDeleteTraining(t.id)} className="absolute top-4 right-4 text-[#a19f9d] hover:text-[#a4262c] opacity-0 group-hover:opacity-100 transition-opacity"><Lucide.Trash2 size={16}/></button>
                                    )}
                                    <div className="flex items-start gap-3 mb-3 pr-6">
                                        <div className="p-2 bg-[#f3f2f1] text-[#0078d4] rounded border border-[#edebe9]"><Lucide.GraduationCap size={20}/></div>
                                        <div>
                                            <h4 className="font-semibold text-[#323130] line-clamp-2">{t.title}</h4>
                                            <p className="text-xs text-[#605e5c] mt-1 line-clamp-2">{t.description}</p>
                                        </div>
                                    </div>
                                    <div className="mt-auto pt-4 border-t border-[#edebe9] flex justify-between items-center">
                                        <a href={t.link} target="_blank" rel="noreferrer" className="text-sm text-[#0078d4] font-semibold hover:underline">Start Learning &rarr;</a>
                                        {isCompleted ? (
                                            <span className="text-xs text-[#107c10] font-semibold flex items-center gap-1"><Lucide.CheckCircle size={14}/> Completed</span>
                                        ) : (
                                            <button onClick={()=>{
                                                const newCompletions = t.completions ? [...t.completions, user.uid] : [user.uid];
                                                onMarkComplete(t.id, newCompletions);
                                            }} className="text-xs bg-[#f3f2f1] hover:bg-[#dff6dd] hover:text-[#107c10] px-2 py-1 rounded border border-[#edebe9] transition-colors font-medium">Mark Done</button>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                        {trainings.length === 0 && <div className="col-span-full text-center py-10 text-[#605e5c]">No training modules assigned yet.</div>}
                    </div>
                </div>
            );
        };
        
        const AssetsModule = ({ user, assets, allUsers, onAddAsset, onAssignAsset, onDeleteAsset }) => {
            const [name, setName] = useState('');
            const [type, setType] = useState('Laptop');
            const [serial, setSerial] = useState('');
            
            const handleAdd = (e) => {
                e.preventDefault();
                if(!name || !serial) return;
                onAddAsset({ name, type, serialNumber: serial, status: 'Available', assignedTo: null, assignedName: '', addedAt: serverTimestamp() });
                setName(''); setSerial('');
            };

            const myAssets = assets.filter(a => a.assignedTo === user.uid);

            return (
                <div className="space-y-6 pb-20 animate-fade-in">
                    <header><h2 className="text-2xl font-semibold text-[#323130]">Asset Management</h2></header>
                    
                    {user.role === 'Admin' && (
                        <div className="bg-white p-6 rounded shadow-sm border border-[#edebe9]">
                            <h3 className="font-semibold text-[#323130] mb-4">Add New Asset</h3>
                            <form onSubmit={handleAdd} className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                <input type="text" className="border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4]" placeholder="Asset Name (e.g. MacBook Pro)" value={name} onChange={e=>setName(e.target.value)} required />
                                <select className="border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4]" value={type} onChange={e=>setType(e.target.value)}>
                                    <option>Laptop</option><option>Mobile Phone</option><option>Monitor</option><option>Software License</option><option>Other</option>
                                </select>
                                <input type="text" className="border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4]" placeholder="Serial / License Key" value={serial} onChange={e=>setSerial(e.target.value)} required />
                                <button className="bg-[#0078d4] text-white py-2 rounded font-semibold hover:bg-[#106ebe] shadow-sm">Add Asset</button>
                            </form>
                        </div>
                    )}

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {user.role === 'Admin' ? (
                            <div className="md:col-span-2 bg-white rounded shadow-sm border border-[#edebe9] overflow-hidden">
                                <div className="p-4 bg-[#f3f2f1] border-b border-[#edebe9] font-semibold text-[#323130]">Company Assets Inventory</div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-sm text-left">
                                        <thead className="bg-[#faf9f8] text-[#605e5c] text-xs uppercase">
                                            <tr><th className="px-4 py-3">Asset</th><th className="px-4 py-3">Serial/Key</th><th className="px-4 py-3">Status</th><th className="px-4 py-3">Assignment</th><th className="px-4 py-3 text-right">Actions</th></tr>
                                        </thead>
                                        <tbody className="divide-y divide-[#edebe9]">
                                            {assets.map(a => (
                                                <tr key={a.id} className="hover:bg-[#faf9f8]">
                                                    <td className="px-4 py-3 font-medium text-[#323130]"><div className="flex items-center gap-2"><Lucide.MonitorSmartphone size={16} className="text-[#0078d4]"/> {a.name} <span className="text-xs text-[#605e5c]">({a.type})</span></div></td>
                                                    <td className="px-4 py-3 font-mono text-xs text-[#605e5c]">{a.serialNumber}</td>
                                                    <td className="px-4 py-3"><span className={`px-2 py-1 rounded text-xs font-semibold ${a.status==='Available'?'bg-[#dff6dd] text-[#107c10]':'bg-[#eff6fc] text-[#0078d4]'}`}>{a.status}</span></td>
                                                    <td className="px-4 py-3">
                                                        {a.status === 'Available' ? (
                                                            <select className="text-xs border border-[#8a8886] rounded p-1" onChange={(e) => {
                                                                const uid = e.target.value;
                                                                if(!uid) return;
                                                                const emp = allUsers.find(u=>u.id===uid);
                                                                onAssignAsset(a.id, {status: 'Assigned', assignedTo: uid, assignedName: emp.name});
                                                            }}>
                                                                <option value="">Assign to...</option>
                                                                {allUsers.map(u=><option key={u.id} value={u.id}>{u.name}</option>)}
                                                            </select>
                                                        ) : (
                                                            <div className="flex items-center gap-2 text-xs font-medium">
                                                                {a.assignedName} 
                                                                <button onClick={()=>onAssignAsset(a.id, {status: 'Available', assignedTo: null, assignedName: ''})} className="text-[#a4262c] hover:underline">Revoke</button>
                                                            </div>
                                                        )}
                                                    </td>
                                                    <td className="px-4 py-3 text-right"><button onClick={()=>onDeleteAsset(a.id)} className="text-[#a4262c] text-xs font-semibold hover:underline"><Lucide.Trash2 size={16}/></button></td>
                                                </tr>
                                            ))}
                                            {assets.length === 0 && <tr><td colSpan="5" className="text-center py-6 text-[#605e5c]">No assets recorded.</td></tr>}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        ) : (
                            <div className="md:col-span-2 bg-white rounded shadow-sm border border-[#edebe9] p-6">
                                <h3 className="font-semibold text-[#323130] border-b border-[#edebe9] pb-3 mb-4">My Assigned Assets</h3>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    {myAssets.map(a => (
                                        <div key={a.id} className="border border-[#edebe9] rounded p-4 flex items-start gap-4 hover:border-[#0078d4] transition-colors">
                                            <div className="p-3 bg-[#eff6fc] text-[#0078d4] rounded-full"><Lucide.MonitorSmartphone size={24}/></div>
                                            <div>
                                                <h4 className="font-semibold text-[#323130]">{a.name}</h4>
                                                <p className="text-xs text-[#605e5c] uppercase tracking-wider mb-1">{a.type}</p>
                                                <p className="text-xs font-mono text-[#605e5c] bg-[#f3f2f1] px-2 py-0.5 rounded inline-block border border-[#edebe9]">SN: {a.serialNumber}</p>
                                            </div>
                                        </div>
                                    ))}
                                    {myAssets.length === 0 && <div className="col-span-3 py-10 text-center text-[#605e5c] border border-dashed border-[#edebe9] rounded">You have no assets assigned to you currently.</div>}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const ExpensesModule = ({ user, expenses, onSubmitExpense, onUpdateExpense }) => {
            const [title, setTitle] = useState('');
            const [amount, setAmount] = useState('');
            const [category, setCategory] = useState('Travel');

            const handleSubmit = (e) => {
                e.preventDefault();
                if(!title || !amount) return;
                onSubmitExpense({ title, amount: parseFloat(amount), category, status: 'Pending', userId: user.uid, userName: user.name, date: new Date().toLocaleDateString(), timestamp: serverTimestamp() });
                setTitle(''); setAmount('');
            };

            const myExpenses = expenses.filter(ex => ex.userId === user.uid);
            const adminPending = expenses.filter(ex => ex.status === 'Pending');

            return (
                <div className="space-y-6 pb-20 animate-fade-in">
                    <header><h2 className="text-2xl font-semibold text-[#323130]">Expense Claims</h2></header>
                    
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="bg-white p-6 rounded shadow-sm border border-[#edebe9]">
                            <h3 className="font-semibold text-[#323130] mb-4">Submit New Claim</h3>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div>
                                    <label className="text-xs font-semibold text-[#605e5c]">Description</label>
                                    <input type="text" className="w-full border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4] mt-1" value={title} onChange={e=>setTitle(e.target.value)} required />
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="text-xs font-semibold text-[#605e5c]">Amount (₹)</label>
                                        <input type="number" className="w-full border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4] mt-1" value={amount} onChange={e=>setAmount(e.target.value)} required />
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-[#605e5c]">Category</label>
                                        <select className="w-full border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4] mt-1 bg-white" value={category} onChange={e=>setCategory(e.target.value)}>
                                            <option>Travel</option><option>Meals</option><option>Office Supplies</option><option>Other</option>
                                        </select>
                                    </div>
                                </div>
                                <button className="w-full bg-[#0078d4] text-white py-2 rounded font-semibold hover:bg-[#106ebe] shadow-sm mt-2">Submit Claim</button>
                            </form>
                        </div>

                        <div className="lg:col-span-2 space-y-6">
                            {user.role === 'Admin' && adminPending.length > 0 && (
                                <div className="bg-white rounded shadow-sm border border-[#fde7e9] overflow-hidden">
                                    <div className="p-4 bg-[#fde7e9] text-[#a4262c] font-semibold border-b border-[#fbd3d6] flex justify-between items-center">
                                        <span>Action Required: Pending Approvals</span>
                                        <span className="bg-[#a4262c] text-white px-2 py-0.5 rounded text-xs">{adminPending.length}</span>
                                    </div>
                                    <div className="p-4 space-y-3">
                                        {adminPending.map(ex => (
                                            <div key={ex.id} className="flex justify-between items-center p-3 border border-[#edebe9] rounded bg-[#faf9f8]">
                                                <div>
                                                    <p className="font-semibold text-[#323130]">{ex.title} <span className="font-normal text-[#605e5c] text-sm ml-2">by {ex.userName}</span></p>
                                                    <p className="text-xs text-[#605e5c] mt-0.5">{ex.category} &bull; {ex.date}</p>
                                                </div>
                                                <div className="flex items-center gap-4">
                                                    <span className="font-bold text-lg text-[#323130]">₹{ex.amount}</span>
                                                    <div className="flex gap-2">
                                                        <button onClick={()=>onUpdateExpense(ex.id, {status: 'Approved'})} className="p-2 bg-[#dff6dd] text-[#107c10] rounded hover:bg-[#c3f1c0]"><Lucide.Check size={18}/></button>
                                                        <button onClick={()=>onUpdateExpense(ex.id, {status: 'Rejected'})} className="p-2 bg-[#fde7e9] text-[#a4262c] rounded hover:bg-[#fbd3d6]"><Lucide.X size={18}/></button>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            <div className="bg-white rounded shadow-sm border border-[#edebe9] overflow-hidden">
                                <div className="p-4 bg-[#f3f2f1] border-b border-[#edebe9] font-semibold text-[#323130]">My Expense History</div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-sm text-left">
                                        <thead className="bg-[#faf9f8] text-[#605e5c] text-xs uppercase">
                                            <tr><th className="px-4 py-3">Date</th><th className="px-4 py-3">Description</th><th className="px-4 py-3">Category</th><th className="px-4 py-3">Amount</th><th className="px-4 py-3">Status</th></tr>
                                        </thead>
                                        <tbody className="divide-y divide-[#edebe9]">
                                            {myExpenses.map(ex => (
                                                <tr key={ex.id} className="hover:bg-[#faf9f8]">
                                                    <td className="px-4 py-3 text-xs text-[#605e5c]">{ex.date}</td>
                                                    <td className="px-4 py-3 font-medium text-[#323130]">{ex.title}</td>
                                                    <td className="px-4 py-3 text-xs text-[#605e5c]">{ex.category}</td>
                                                    <td className="px-4 py-3 font-semibold text-[#323130]">₹{ex.amount}</td>
                                                    <td className="px-4 py-3">
                                                        <span className={`px-2 py-1 rounded text-xs font-semibold ${ex.status==='Pending'?'bg-[#fff4ce] text-[#795c00]': ex.status==='Approved' ? 'bg-[#dff6dd] text-[#107c10]' : 'bg-[#fde7e9] text-[#a4262c]'}`}>{ex.status}</span>
                                                    </td>
                                                </tr>
                                            ))}
                                            {myExpenses.length === 0 && <tr><td colSpan="5" className="text-center py-6 text-[#605e5c]">No expenses filed yet.</td></tr>}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const OKRModule = ({ user, okrs, onSubmitOKR, onUpdateProgress, onDeleteOKR }) => {
            const [objective, setObjective] = useState('');
            const [quarter, setQuarter] = useState('Q3-2026');

            const handleSubmit = (e) => {
                e.preventDefault();
                if(!objective) return;
                onSubmitOKR({ objective, progress: 0, quarter, userId: user.uid, userName: user.name, timestamp: serverTimestamp() });
                setObjective('');
            };

            const displayOKRs = user.role === 'Admin' ? okrs : okrs.filter(o => o.userId === user.uid);

            return (
                <div className="space-y-6 pb-20 animate-fade-in">
                    <header>
                        <h2 className="text-2xl font-semibold text-[#323130]">Objectives & Key Results (OKRs)</h2>
                        <p className="text-[#605e5c] text-sm">Align individual goals with company vision.</p>
                    </header>

                    <div className="bg-white p-6 rounded shadow-sm border border-[#edebe9]">
                        <form onSubmit={handleSubmit} className="flex flex-col md:flex-row gap-4 items-end">
                            <div className="flex-1 w-full">
                                <label className="text-xs font-semibold text-[#605e5c]">New Objective</label>
                                <input type="text" className="w-full border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4] mt-1" placeholder="e.g. Increase customer retention by 15%" value={objective} onChange={e=>setObjective(e.target.value)} required />
                            </div>
                            <div className="w-full md:w-48">
                                <label className="text-xs font-semibold text-[#605e5c]">Timeline</label>
                                <select className="w-full border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4] mt-1 bg-white" value={quarter} onChange={e=>setQuarter(e.target.value)}>
                                    <option>Q1-2026</option><option>Q2-2026</option><option>Q3-2026</option><option>Q4-2026</option>
                                </select>
                            </div>
                            <button className="w-full md:w-auto bg-[#107c10] text-white px-6 py-2 rounded font-semibold hover:bg-[#0b5a0b] shadow-sm">Set Goal</button>
                        </form>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {displayOKRs.map(okr => (
                            <div key={okr.id} className="bg-white p-5 rounded shadow-sm border border-[#edebe9] hover:border-[#c8c6c4] transition-colors relative">
                                {(user.role === 'Admin' || okr.userId === user.uid) && (
                                    <button onClick={()=>onDeleteOKR(okr.id)} className="absolute top-4 right-4 text-[#a19f9d] hover:text-[#a4262c]"><Lucide.Trash2 size={16}/></button>
                                )}
                                <div className="flex items-center gap-2 mb-2">
                                    <span className="px-2 py-0.5 bg-[#f3f2f1] text-[#605e5c] text-xs font-semibold rounded">{okr.quarter}</span>
                                    {user.role === 'Admin' && <span className="text-xs text-[#0078d4] font-semibold">{okr.userName}</span>}
                                </div>
                                <h3 className="font-semibold text-lg text-[#323130] pr-6 mb-4">{okr.objective}</h3>
                                
                                <div>
                                    <div className="flex justify-between text-xs font-semibold text-[#605e5c] mb-1">
                                        <span>Progress</span>
                                        <span className={okr.progress === 100 ? 'text-[#107c10]' : 'text-[#0078d4]'}>{okr.progress}%</span>
                                    </div>
                                    {okr.userId === user.uid ? (
                                        <input 
                                            type="range" min="0" max="100" step="5" value={okr.progress}
                                            onChange={(e)=>onUpdateProgress(okr.id, parseInt(e.target.value))}
                                        />
                                    ) : (
                                        <div className="w-full bg-[#f3f2f1] rounded h-2 border border-[#edebe9]">
                                            <div className="bg-[#0078d4] h-2 rounded transition-all duration-300" style={{width: `${okr.progress}%`}}></div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        ))}
                        {displayOKRs.length === 0 && <div className="col-span-full text-center py-10 text-[#605e5c]">No objectives set yet.</div>}
                    </div>
                </div>
            );
        };

        const VaultModule = ({ user, documents, onAddDocument, onDeleteDocument }) => {
            const [title, setTitle] = useState('');
            const [link, setLink] = useState('');
            const [category, setCategory] = useState('Policy');

            const handleSubmit = (e) => {
                e.preventDefault();
                if(!title || !link) return;
                onAddDocument({ title, link, category, uploadedBy: user.name, timestamp: serverTimestamp() });
                setTitle(''); setLink('');
            };

            const getIcon = (cat) => {
                if(cat==='Policy') return <Lucide.ShieldCheck size={24} className="text-[#a4262c]" />;
                if(cat==='Template') return <Lucide.FileText size={24} className="text-[#0078d4]" />;
                return <Lucide.BookOpen size={24} className="text-[#107c10]" />;
            };

            return (
                <div className="space-y-6 pb-20 animate-fade-in">
                    <header>
                        <h2 className="text-2xl font-semibold text-[#323130]">Document Vault</h2>
                        <p className="text-[#605e5c] text-sm">Centralized company resources and policies.</p>
                    </header>

                    {user.role === 'Admin' && (
                        <div className="bg-white p-6 rounded shadow-sm border border-[#edebe9]">
                            <h3 className="font-semibold text-[#323130] mb-4">Publish Document Link</h3>
                            <form onSubmit={handleSubmit} className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                <input type="text" className="border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4]" placeholder="Document Title" value={title} onChange={e=>setTitle(e.target.value)} required />
                                <select className="border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4] bg-white" value={category} onChange={e=>setCategory(e.target.value)}>
                                    <option>Policy</option><option>Template</option><option>Guide</option>
                                </select>
                                <input type="url" className="border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4]" placeholder="URL (Google Drive, Sharepoint...)" value={link} onChange={e=>setLink(e.target.value)} required />
                                <button className="bg-[#0078d4] text-white py-2 rounded font-semibold hover:bg-[#106ebe] shadow-sm">Publish Link</button>
                            </form>
                        </div>
                    )}

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {documents.map(doc => (
                            <a key={doc.id} href={doc.link} target="_blank" rel="noopener noreferrer" className="block bg-white p-5 rounded shadow-sm border border-[#edebe9] hover:border-[#0078d4] hover:shadow-md transition-all group relative">
                                {user.role === 'Admin' && (
                                    <button onClick={(e)=>{e.preventDefault(); onDeleteDocument(doc.id);}} className="absolute top-4 right-4 text-[#a19f9d] hover:text-[#a4262c]"><Lucide.Trash2 size={16}/></button>
                                )}
                                <div className="flex items-center gap-4 mb-3">
                                    <div className="p-3 bg-[#f3f2f1] rounded-lg border border-[#edebe9] group-hover:bg-[#eff6fc] transition-colors">{getIcon(doc.category)}</div>
                                    <div>
                                        <p className="text-xs font-semibold text-[#605e5c] uppercase tracking-wider">{doc.category}</p>
                                        <h3 className="font-semibold text-[#323130] group-hover:text-[#0078d4] transition-colors line-clamp-1">{doc.title}</h3>
                                    </div>
                                </div>
                                <div className="flex justify-between items-center text-xs text-[#605e5c] border-t border-[#edebe9] pt-3 mt-3">
                                    <span>By {doc.uploadedBy}</span>
                                    <span className="flex items-center gap-1">Open <Lucide.ExternalLink size={12}/></span>
                                </div>
                            </a>
                        ))}
                        {documents.length === 0 && <div className="col-span-full py-10 text-center text-[#605e5c]">No documents in the vault.</div>}
                    </div>
                </div>
            );
        };

        const CRMModule = ({ user, clients, onAddClient, onUpdateClient, onDeleteClient }) => {
            const [form, setForm] = useState({name:'',company:'',phone:'',email:'',status:'Lead',requirement:'',value:'',priority:'Medium',source:''});
            const [search,setSearch] = useState('');
            const [filter,setFilter] = useState('All');
            const [expanded,setExpanded] = useState(null);
            const [note,setNote] = useState('');
            const [reminder,setReminder] = useState({at:'',message:'',assignee:''});
            const [busy,setBusy] = useState(false);
            const [clock,setClock] = useState(Date.now());
            useEffect(()=>{const t=setInterval(()=>setClock(Date.now()),30000);return ()=>clearInterval(t)},[]);
            const save = async(e)=>{e.preventDefault();if(!form.name.trim()||!form.phone.trim())return;setBusy(true);try{await onAddClient({...form,value:Number(form.value)||0,addedBy:user.name,logs:[],reminders:[],timestamp:serverTimestamp()});setForm({name:'',company:'',phone:'',email:'',status:'Lead',requirement:'',value:'',priority:'Medium',source:''})}catch(err){alert(err.message)}finally{setBusy(false)}};
            const update = async(id,patch)=>{try{await onUpdateClient(id,patch)}catch(err){alert(err.message)}};
            const addNote=async(e,c)=>{e.preventDefault();if(!note.trim())return;await update(c.id,{logs:[...(c.logs||[]),{text:note.trim(),date:new Date().toLocaleString(),by:user.name}]});setNote('')};
            const addReminder=async(e,c)=>{e.preventDefault();if(!reminder.at)return;const r={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),at:new Date(reminder.at).toISOString(),message:reminder.message||'Call client',assignee:reminder.assignee.trim().toLowerCase(),done:false,createdBy:user.email||user.name};await update(c.id,{reminders:[...(c.reminders||[]),r]});setReminder({at:'',message:'',assignee:''})};
            const setReminderDone=(c,r)=>update(c.id,{reminders:(c.reminders||[]).map(x=>x.id===r.id?{...x,done:true,doneAt:new Date().toISOString()}:x)});
            const matches=clients.filter(c=>(filter==='All'||c.status===filter)&&[c.name,c.company,c.phone,c.email,c.requirement].some(v=>String(v||'').toLowerCase().includes(search.toLowerCase())));
            const upcoming=clients.flatMap(c=>(c.reminders||[]).filter(r=>!r.done).map(r=>({...r,client:c}))).sort((a,b)=>new Date(a.at)-new Date(b.at));
            const myEmail=(user.email||'').toLowerCase();
            const myReminders=upcoming.filter(r=>!r.assignee||r.assignee===myEmail);
            useEffect(()=>{if(!('Notification' in window)||Notification.permission!=='granted')return;myReminders.forEach(r=>{const when=new Date(r.at).getTime();const key='vds-crm-alert-'+r.id;if(when<=clock&&clock-when<86400000&&!sessionStorage.getItem(key)){new Notification('CRM Follow-up: '+r.client.name,{body:r.message,icon:LOGO_URL});sessionStorage.setItem(key,'1')}})},[clock,clients,user.email]);
            const field=(key,placeholder,type='text')=><input type={type} className="border border-[#8a8886] p-2 rounded w-full" placeholder={placeholder} value={form[key]} onChange={e=>setForm({...form,[key]:e.target.value})}/>;
            const fmt=(d)=>{const t=new Date(d);return Number.isNaN(t.getTime())?'—':t.toLocaleString()};
            return <div className="space-y-6 pb-20 animate-fade-in">
                <header className="flex flex-wrap justify-between gap-3"><div><h2 className="text-2xl font-semibold">Client Relationship Management</h2><p className="text-sm text-[#605e5c]">Sales pipeline, contacts, call history and assigned follow-ups. Existing records remain in Firestore.</p></div><button className="border rounded px-3 py-2 bg-white" onClick={()=>('Notification' in window)?Notification.requestPermission():alert('Notifications not supported')}>Enable reminders</button></header>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-3">{[['Total Clients',clients.length],['Active Clients',clients.filter(c=>c.status==='Active Client').length],['Open Leads',clients.filter(c=>c.status==='Lead').length],['Due Reminders',myReminders.filter(r=>new Date(r.at).getTime()<=clock).length]].map(([label,value])=><div key={label} className="bg-white p-4 rounded border"><p className="text-xs text-[#605e5c]">{label}</p><p className="text-2xl font-semibold">{value}</p></div>)}</div>
                <section className="bg-white p-5 rounded border"><h3 className="font-semibold mb-3">Add New Client / Lead</h3><form onSubmit={save} className="grid grid-cols-1 md:grid-cols-3 gap-3">{field('name','Contact name *')}{field('company','Company')}{field('phone','Phone *','tel')}{field('email','Email','email')}{field('requirement','Client requirement')}{field('value','Estimated quotation ₹','number')}{field('source','Lead source')}<select className="border p-2 rounded" value={form.status} onChange={e=>setForm({...form,status:e.target.value})}><option>Lead</option><option>Active Client</option><option>Inactive</option></select><select className="border p-2 rounded" value={form.priority} onChange={e=>setForm({...form,priority:e.target.value})}><option>Low</option><option>Medium</option><option>High</option><option>Urgent</option></select><button disabled={busy} className="bg-[#0078d4] text-white px-5 py-2 rounded font-semibold md:col-span-3">{busy?'Saving...':'Save Client'}</button></form></section>
                <section className="bg-white border rounded p-4"><h3 className="font-semibold mb-2">Follow-up Reminder Center</h3><p className="text-xs text-[#605e5c] mb-3">In-app and browser alerts work while this page is open. Closed-app mobile push requires a separate server and Firebase Messaging setup.</p>{myReminders.length===0?<p className="text-sm text-[#605e5c]">No pending reminders assigned to you.</p>:<div className="space-y-2 max-h-52 overflow-auto">{myReminders.slice(0,30).map(r=><div key={r.id} className="border rounded p-3 flex flex-wrap justify-between gap-2"><div><b>{r.client.name}</b> — {r.message}<div className={'text-xs '+(new Date(r.at).getTime()<=clock?'text-red-700':'text-[#605e5c]')}>{fmt(r.at)} {new Date(r.at).getTime()<=clock?'• Due':''}</div></div><button onClick={()=>setReminderDone(r.client,r)} className="text-[#0078d4] text-sm">Mark done</button></div>)}</div>}</section>
                <div className="flex flex-wrap gap-3"><input className="flex-1 min-w-[180px] border rounded p-2" placeholder="Search clients, companies, phone, requirement" value={search} onChange={e=>setSearch(e.target.value)}/><select className="border rounded p-2" value={filter} onChange={e=>setFilter(e.target.value)}>{['All','Lead','Active Client','Inactive'].map(s=><option key={s}>{s}</option>)}</select></div>
                <div className="space-y-3">{matches.map(c=><div key={c.id} className="bg-white border rounded overflow-hidden"><div className="p-4 flex flex-wrap justify-between gap-3"><button className="text-left flex-1" onClick={()=>{setExpanded(expanded===c.id?null:c.id);setNote('');setReminder({at:'',message:'',assignee:''})}}><b>{c.name||'Unnamed'}</b> <span className="text-sm text-[#605e5c]">{c.company||''}</span><p className="text-xs text-[#605e5c] mt-1">{c.phone} · {c.email||'No email'} · {c.requirement||''}</p></button><div className="flex items-center gap-2"><select className="border rounded p-1 text-sm" value={c.status||'Lead'} onChange={e=>update(c.id,{status:e.target.value})}>{['Lead','Active Client','Inactive'].map(s=><option key={s}>{s}</option>)}</select>{(user.role==='Admin'||user.email===CRM_EMAIL)&&<button className="text-red-700 text-xs" onClick={()=>{if(confirm('Permanently delete this client?'))onDeleteClient(c.id)}}>Delete</button>}</div></div>{expanded===c.id&&<div className="border-t bg-[#faf9f8] p-4 space-y-4"><div className="flex flex-wrap gap-4 text-sm"><span>Value: ₹{Number(c.value||0).toLocaleString('en-IN')}</span><span>Priority: {c.priority||'—'}</span><span>Source: {c.source||'—'}</span>{c.phone&&<a className="text-[#0078d4]" href={'tel:'+c.phone}>Call</a>}{c.phone&&<a className="text-[#0078d4]" target="_blank" rel="noreferrer" href={'https://wa.me/'+String(c.phone).replace(/\D/g,'')}>WhatsApp</a>}</div><h4 className="font-semibold text-sm">Call Logs & Notes</h4>{(c.logs||[]).map((l,i)=><div key={i} className="bg-white border p-2 text-sm">{l.text}<p className="text-xs text-[#605e5c]">{l.date} · {l.by}</p></div>)}<form onSubmit={e=>addNote(e,c)} className="flex gap-2"><input className="border p-2 rounded flex-1 min-w-0" value={note} onChange={e=>setNote(e.target.value)} placeholder="Call outcome / client note"/><button className="bg-[#107c10] text-white px-3 rounded">Add Note</button></form><h4 className="font-semibold text-sm">Schedule Follow-up</h4><form onSubmit={e=>addReminder(e,c)} className="grid grid-cols-1 md:grid-cols-4 gap-2"><input type="datetime-local" required className="border rounded p-2" value={reminder.at} onChange={e=>setReminder({...reminder,at:e.target.value})}/><input className="border rounded p-2" placeholder="Reminder message" value={reminder.message} onChange={e=>setReminder({...reminder,message:e.target.value})}/><input className="border rounded p-2" placeholder="Assigned employee email (blank = all)" value={reminder.assignee} onChange={e=>setReminder({...reminder,assignee:e.target.value})}/><button className="bg-[#0078d4] text-white rounded p-2">Set Reminder</button></form>{(c.reminders||[]).map(r=><div key={r.id} className="flex justify-between gap-2 text-xs border-b py-2"><span>{fmt(r.at)} · {r.message} · {r.assignee||'All'} · {r.done?'Completed':'Pending'}</span>{!r.done&&<button className="text-[#0078d4]" onClick={()=>setReminderDone(c,r)}>Done</button>}</div>)}</div>}</div>)}{matches.length===0&&<p className="text-center p-8 text-[#605e5c]">No matching clients.</p>}</div>

        // Non-destructive activity inbox: derives notifications from existing Firestore records.
        const ActivityCenter = ({ items, seen, onRead, onReadAll, onNavigate }) => (
            <div className="bg-white border rounded shadow-sm p-5 space-y-4">

        // Master Admin IT operations. Only selected existing collections can be edited.
        const AdminITConsole = ({ tickets, tasks, notices, onUpdateTicket, onDeleteTicket, onUpdateTask, onDeleteTask, onDeleteNotice }) => {

            const run=async (key,fn,destructive=false)=>{

            return <div className="space-y-6 pb-16">
                <h2 className="text-2xl font-semibold">Master Admin — IT & Operations</h2>
                <p className="text-sm text-[#605e5c]">Manage help-desk requests, task records and notices. Existing clients, attendance and unrelated data are not modified.</p>
                {error&&<p role="alert" className="p-3 bg-[#fde7e9] text-[#a4262c]">{error}</p>}
                <div className="bg-white border rounded p-4 space-y-3"><h3 className="font-semibold">IT & Help Desk Tickets ({tickets.length})</h3>
                    {tickets.map(t=><div key={t.id} className="border-t pt-3 flex flex-wrap items-center gap-3">

                    </div>)}
