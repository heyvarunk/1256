<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Varun Dynamics ERP (Local)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- jsPDF for Payslip Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>

    <style>
        /* Essential for Mobile Full Height */
        html, body, #root {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; 
            font-family: 'Inter', sans-serif;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f8fafc; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .animate-fade-in { animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans selection:bg-blue-200">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18.2.0';
        import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';
        import * as Lucide from 'https://esm.sh/lucide-react@0.263.1';
        
        // Firebase Imports
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, setDoc, updateDoc, deleteDoc, doc, query, onSnapshot, serverTimestamp, orderBy, where, getDoc, getDocs } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js';

        // ------------------------------------------------------------------
        // CONFIGURATION
        // ------------------------------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyCVmgAeNba4c5EGSSUZORuB-cZqI4ORBsc",
            authDomain: "varun-dynamics-app.firebaseapp.com",
            projectId: "varun-dynamics-app",
            storageBucket: "varun-dynamics-app.firebasestorage.app",
            messagingSenderId: "67016520294",
            appId: "1:67016520294:web:fd1299acabd1a7a6cf73a7",
            measurementId: "G-64DE9YNTWC"
        };
        // ------------------------------------------------------------------

        const APP_ID = 'varun-dynamics-local';
        const MASTER_ADMIN_EMAIL = 'info@varundynamics.in';
        const LOGO_URL = "https://raw.githubusercontent.com/heyvarunk/124/main/Copilot_20250716_231520.png";

        // --- APP INITIALIZATION ---
        let app, auth, db, isConfigured = false;
        
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            isConfigured = true;
        } catch (e) {
            console.warn("Firebase configuration error:", e);
        }

        // --- HELPER: NOTIFICATIONS ---
        const requestNotificationPermission = () => {
            if (!("Notification" in window)) return;
            if (Notification.permission !== "granted") {
                Notification.requestPermission();
            }
        };

        const sendNotification = (title, body) => {
            if (Notification.permission === "granted") {
                new Notification(title, { body, icon: LOGO_URL });
            }
        };

        // --- COMPONENTS ---

        const ConfigErrorScreen = () => (
            <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                <div className="bg-white rounded-xl shadow-2xl p-8 max-w-lg w-full text-center space-y-4">
                    <div className="w-16 h-16 bg-red-100 text-red-600 rounded-full mx-auto flex items-center justify-center">
                        <Lucide.AlertTriangle size={32} />
                    </div>
                    <h2 className="text-2xl font-bold text-slate-800">Connection Error</h2>
                    <p className="text-slate-600">Could not connect to Firebase.</p>
                    <button onClick={() => window.location.reload()} className="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">Retry</button>
                </div>
            </div>
        );

        const LoadingScreen = () => (
            <div className="min-h-screen bg-slate-900 flex flex-col items-center justify-center p-4">
                <div className="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                <h2 className="text-xl font-bold text-white">Loading System...</h2>
            </div>
        );

        const LoginScreen = ({ onJoin }) => {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError('');

                try {
                    const normalizedEmail = email.toLowerCase().trim();
                    const userCredential = await signInWithEmailAndPassword(auth, normalizedEmail, password);
                    const user = userCredential.user;

                    requestNotificationPermission();

                    if (normalizedEmail === MASTER_ADMIN_EMAIL) {
                        const adminProfile = {
                            name: 'Master Admin',
                            email: normalizedEmail,
                            role: 'Admin',
                            location: 'Headquarters',
                            photoURL: '', 
                            uid: user.uid,
                            lastActive: serverTimestamp()
                        };
                        await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'users', 'admin_master'), adminProfile, { merge: true });
                        onJoin(adminProfile);
                        return;
                    }

                    const usersRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'users');
                    const q = query(usersRef, where("email", "==", normalizedEmail));
                    const querySnapshot = await getDocs(q);

                    if (querySnapshot.empty) {
                        throw new Error("Access Denied. Your email is not registered in the system.");
                    }

                    const userDoc = querySnapshot.docs[0];
                    await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'users', userDoc.id), {
                        lastActive: serverTimestamp(),
                        uid: user.uid
                    });
                    onJoin({ ...userDoc.data(), uid: user.uid, docId: userDoc.id });

                } catch (err) {
                    console.error(err);
                    setError(err.message.replace('Firebase:', '').trim());
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-[100vh] bg-slate-900 flex flex-col items-center justify-center p-4 overflow-y-auto">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden animate-fade-in flex-shrink-0">
                        <div className="bg-gradient-to-br from-blue-900 to-slate-900 p-8 text-center relative">
                             <div className="w-20 h-20 bg-white/10 backdrop-blur-md rounded-xl mx-auto flex items-center justify-center mb-4 shadow-lg border border-white/10 p-2 overflow-hidden">
                                <img src={LOGO_URL} alt="Varun Dynamics Logo" className="w-full h-full object-contain" />
                            </div>
                            <h1 className="text-2xl font-bold text-white tracking-tight">Varun Dynamics</h1>
                            <p className="text-blue-200 text-sm mt-1 font-medium">Enterprise Resource Portal</p>
                        </div>
                        <form onSubmit={handleLogin} className="p-8 space-y-6">
                            {error && <div className="bg-red-50 text-red-600 p-3 rounded-xl text-sm flex items-center gap-2 border border-red-100"><Lucide.AlertCircle size={16}/> {error}</div>}
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Email Access ID</label>
                                    <input type="email" required className="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-base transition-all" placeholder="name@varundynamics.in" value={email} onChange={(e) => setEmail(e.target.value)} />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Secure Password</label>
                                    <input type="password" required className="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-base transition-all" placeholder="••••••••" value={password} onChange={(e) => setPassword(e.target.value)} />
                                </div>
                            </div>
                            <button type="submit" disabled={loading} className="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-3.5 rounded-xl transition-all flex items-center justify-center gap-2 text-base shadow-lg shadow-blue-900/20 active:scale-[0.98]">
                                {loading ? 'Authenticating...' : 'Sign In Securely'} <Lucide.ArrowRight size={18} />
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        // --- DYNAMIC MODULES ---

        const Dashboard = ({ user, attendanceLogs, tasks, leaves, reports, announcements, setActiveTab, onMarkAttendance }) => {
            const time = new Date().getHours();
            const greeting = time < 12 ? 'Good Morning' : time < 18 ? 'Good Afternoon' : 'Good Evening';
            const todayLog = attendanceLogs.find(l => l.userId === user.uid && new Date(l.timestamp?.toDate()).toDateString() === new Date().toDateString());
            
            return (
                <div className="space-y-6 pb-20 animate-fade-in">
                    <div className="relative overflow-hidden bg-gradient-to-r from-blue-900 via-blue-800 to-indigo-900 rounded-3xl p-8 text-white shadow-xl">
                        <div className="relative z-10">
                            <p className="text-blue-200 font-medium mb-1">{new Date().toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>
                            <h2 className="text-3xl md:text-4xl font-bold mb-2">{greeting}, {user.name.split(' ')[0]}</h2>
                            <p className="opacity-90 max-w-lg">You have {tasks.filter(t=>t.assignee===user.name && t.status!=='done').length} pending tasks today.</p>
                        </div>
                        <div className="absolute right-0 top-0 h-full w-1/2 bg-white/5 skew-x-12 transform origin-bottom-left"></div>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition-all">
                            <div className="flex justify-between items-start mb-2">
                                <div className="p-2 bg-blue-50 text-blue-600 rounded-lg"><Lucide.Clock size={20} /></div>
                                <span className={`text-xs font-bold px-2 py-1 rounded-full ${todayLog ? 'bg-green-100 text-green-700' : 'bg-slate-100 text-slate-500'}`}>{todayLog ? 'Present' : 'Absent'}</span>
                            </div>
                            <p className="text-slate-500 text-xs font-bold uppercase">Attendance</p>
                            <p className="text-xl font-bold text-slate-800">{todayLog ? 'Clocked In' : 'Not Marked'}</p>
                        </div>
                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition-all">
                            <div className="flex justify-between items-start mb-2">
                                <div className="p-2 bg-purple-50 text-purple-600 rounded-lg"><Lucide.CheckSquare size={20} /></div>
                                <span className="text-xs font-bold px-2 py-1 rounded-full bg-purple-100 text-purple-700">{tasks.filter(t=>t.status==='done').length} Done</span>
                            </div>
                            <p className="text-slate-500 text-xs font-bold uppercase">My Tasks</p>
                            <p className="text-xl font-bold text-slate-800">{tasks.filter(t=>t.assignee===user.name && t.status!=='done').length} Pending</p>
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-5">
                        <h3 className="font-bold text-slate-800 mb-4 text-sm uppercase tracking-wider">Quick Actions</h3>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                            <button onClick={() => onMarkAttendance(todayLog ? 'OUT' : 'IN')} className={`p-4 rounded-xl border flex flex-col items-center justify-center gap-2 transition-all ${todayLog ? 'bg-red-50 border-red-100 text-red-600 hover:bg-red-100' : 'bg-green-50 border-green-100 text-green-600 hover:bg-green-100'}`}>
                                {todayLog ? <Lucide.LogOut size={24}/> : <Lucide.LogIn size={24}/>}
                                <span className="text-xs font-bold">{todayLog ? 'Punch Out' : 'Punch In'}</span>
                            </button>
                            <button onClick={()=>setActiveTab('tasks')} className="p-4 rounded-xl border border-slate-100 hover:border-blue-200 hover:bg-blue-50 text-slate-600 hover:text-blue-600 flex flex-col items-center justify-center gap-2 transition-all">
                                <Lucide.PlusSquare size={24}/>
                                <span className="text-xs font-bold">New Task</span>
                            </button>
                            <button onClick={()=>setActiveTab('payroll')} className="p-4 rounded-xl border border-slate-100 hover:border-green-200 hover:bg-green-50 text-slate-600 hover:text-green-600 flex flex-col items-center justify-center gap-2 transition-all">
                                <Lucide.Wallet size={24}/>
                                <span className="text-xs font-bold">My Payslip</span>
                            </button>
                            <button onClick={()=>setActiveTab('helpdesk')} className="p-4 rounded-xl border border-slate-100 hover:border-purple-200 hover:bg-purple-50 text-slate-600 hover:text-purple-600 flex flex-col items-center justify-center gap-2 transition-all">
                                <Lucide.LifeBuoy size={24}/>
                                <span className="text-xs font-bold">Support</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- ADMIN MODULES ---

        const AdminPayrollManager = ({ users, onUpdateSalary }) => {
            const [selectedUser, setSelectedUser] = useState(null);
            const [salary, setSalary] = useState({ basic: 0, hra: 0, da: 0, special: 0, pf: 0, tax: 0 });

            const handleUserSelect = (e) => {
                const uid = e.target.value;
                if(!uid) { setSelectedUser(null); return; }
                const user = users.find(u => u.id === uid);
                setSelectedUser(user);
                setSalary(user.salaryConfig || { basic: 0, hra: 0, da: 0, special: 0, pf: 0, tax: 0 });
            };

            const handleSave = async () => {
                if(!selectedUser) return;
                await onUpdateSalary(selectedUser.id, salary);
                alert("Salary structure updated successfully!");
            };

            return (
                <div className="space-y-6 pb-20 animate-fade-in">
                    <header><h2 className="text-2xl font-bold text-slate-800">Payroll Management</h2></header>
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <div className="mb-6">
                            <label className="block text-sm font-bold text-slate-700 mb-2">Select Employee</label>
                            <select className="w-full border p-2 rounded-lg" onChange={handleUserSelect}>
                                <option value="">-- Choose Employee --</option>
                                {users.map(u => <option key={u.id} value={u.id}>{u.name} ({u.email})</option>)}
                            </select>
                        </div>

                        {selectedUser && (
                            <div className="space-y-4">
                                <h3 className="font-bold text-blue-900 border-b pb-2">Earnings Configuration</h3>
                                <div className="grid grid-cols-2 gap-4">
                                    <div><label className="text-xs text-slate-500">Basic Pay</label><input type="number" className="w-full border p-2 rounded" value={salary.basic} onChange={e=>setSalary({...salary, basic: parseInt(e.target.value)||0})} /></div>
                                    <div><label className="text-xs text-slate-500">HRA</label><input type="number" className="w-full border p-2 rounded" value={salary.hra} onChange={e=>setSalary({...salary, hra: parseInt(e.target.value)||0})} /></div>
                                    <div><label className="text-xs text-slate-500">DA</label><input type="number" className="w-full border p-2 rounded" value={salary.da} onChange={e=>setSalary({...salary, da: parseInt(e.target.value)||0})} /></div>
                                    <div><label className="text-xs text-slate-500">Special Allow.</label><input type="number" className="w-full border p-2 rounded" value={salary.special} onChange={e=>setSalary({...salary, special: parseInt(e.target.value)||0})} /></div>
                                </div>
                                <h3 className="font-bold text-red-900 border-b pb-2 mt-4">Deductions</h3>
                                <div className="grid grid-cols-2 gap-4">
                                    <div><label className="text-xs text-slate-500">PF</label><input type="number" className="w-full border p-2 rounded" value={salary.pf} onChange={e=>setSalary({...salary, pf: parseInt(e.target.value)||0})} /></div>
                                    <div><label className="text-xs text-slate-500">Tax</label><input type="number" className="w-full border p-2 rounded" value={salary.tax} onChange={e=>setSalary({...salary, tax: parseInt(e.target.value)||0})} /></div>
                                </div>
                                <button onClick={handleSave} className="w-full bg-blue-900 text-white py-3 rounded-lg font-bold mt-4">Save Configuration</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const PayrollModule = ({ user }) => {
            const { salaryConfig } = user;
            
            const downloadPDF = () => {
                if(!salaryConfig) return;
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                doc.setFontSize(20);
                doc.text("Varun Dynamics - Payslip", 105, 20, null, null, "center");
                doc.setFontSize(12);
                doc.text(`Employee: ${user.name}`, 20, 40);
                doc.text(`Role: ${user.role}`, 20, 50);
                doc.text(`Date: ${new Date().toLocaleDateString()}`, 150, 40);

                const earnings = [
                    ["Basic Pay", salaryConfig.basic],
                    ["HRA", salaryConfig.hra],
                    ["DA", salaryConfig.da],
                    ["Special Allowance", salaryConfig.special],
                    ["GROSS EARNINGS", (salaryConfig.basic + salaryConfig.hra + salaryConfig.da + salaryConfig.special)]
                ];

                const deductions = [
                    ["Provident Fund", salaryConfig.pf],
                    ["Professional Tax", salaryConfig.tax],
                    ["TOTAL DEDUCTIONS", (salaryConfig.pf + salaryConfig.tax)]
                ];

                doc.autoTable({
                    startY: 60,
                    head: [['Earnings Head', 'Amount (INR)']],
                    body: earnings,
                    theme: 'grid',
                    headStyles: { fillColor: [22, 160, 133] }
                });

                doc.autoTable({
                    startY: doc.lastAutoTable.finalY + 10,
                    head: [['Deductions Head', 'Amount (INR)']],
                    body: deductions,
                    theme: 'grid',
                    headStyles: { fillColor: [192, 57, 43] }
                });

                const net = (salaryConfig.basic + salaryConfig.hra + salaryConfig.da + salaryConfig.special) - (salaryConfig.pf + salaryConfig.tax);
                doc.setFontSize(14);
                doc.text(`NET PAYABLE: INR ${net}`, 20, doc.lastAutoTable.finalY + 20);

                doc.save("payslip.pdf");
            };

            if (!salaryConfig) {
                return (
                    <div className="p-8 text-center bg-white rounded-xl shadow-sm border border-slate-200 mt-8">
                        <div className="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-400"><Lucide.Ban size={32}/></div>
                        <h3 className="text-lg font-bold text-slate-700">Payroll Not Configured</h3>
                        <p className="text-slate-500 mt-2">Your salary details have not been updated by the Administrator yet.</p>
                    </div>
                );
            }

            const gross = salaryConfig.basic + salaryConfig.hra + salaryConfig.da + salaryConfig.special;
            const deductions = salaryConfig.pf + salaryConfig.tax;
            const net = gross - deductions;

            return (
                <div className="space-y-6 pb-20 animate-fade-in">
                    <header><h2 className="text-2xl font-bold text-slate-800">My Payslip</h2></header>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="bg-gradient-to-br from-slate-800 to-slate-900 rounded-2xl p-6 text-white shadow-xl">
                            <p className="text-slate-400 text-sm font-medium uppercase tracking-wider mb-1">Total Net Payable</p>
                            <h3 className="text-4xl font-bold mb-6">₹ {net.toLocaleString()}</h3>
                            <div className="grid grid-cols-2 gap-4 border-t border-white/10 pt-4">
                                <div><p className="text-slate-400 text-xs">Gross Earnings</p><p className="font-bold text-lg text-green-400">₹ {gross.toLocaleString()}</p></div>
                                <div><p className="text-slate-400 text-xs">Total Deductions</p><p className="font-bold text-lg text-red-400">₹ {deductions.toLocaleString()}</p></div>
                            </div>
                        </div>
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                            <h3 className="font-bold text-slate-800 mb-4 border-b pb-2">Breakdown</h3>
                            <div className="space-y-3 text-sm">
                                <div className="flex justify-between"><span className="text-slate-500">Basic Pay</span><span className="font-medium">₹ {salaryConfig.basic}</span></div>
                                <div className="flex justify-between"><span className="text-slate-500">HRA</span><span className="font-medium">₹ {salaryConfig.hra}</span></div>
                                <div className="flex justify-between"><span className="text-slate-500">Allowances</span><span className="font-medium">₹ {salaryConfig.da + salaryConfig.special}</span></div>
                                <div className="flex justify-between text-red-600"><span className="text-slate-500">Deductions (PF/Tax)</span><span className="font-medium">- ₹ {deductions}</span></div>
                            </div>
                            <button onClick={downloadPDF} className="w-full mt-6 bg-blue-600 text-white py-2 rounded-lg text-sm font-bold hover:bg-blue-700 transition-colors flex items-center justify-center gap-2">
                                <Lucide.Download size={16}/> Download PDF
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const AttendanceModule = ({ user, allUsers, attendanceLogs, onMarkAttendance }) => {
            const today = new Date().toLocaleDateString();
            
            // Employee View
            if (user.role !== 'Admin') {
                const todaysLogs = attendanceLogs.filter(log => log.userId === user.uid && new Date(log.timestamp?.toDate()).toLocaleDateString() === today).sort((a, b) => b.timestamp?.toMillis() - a.timestamp?.toMillis());
                const lastStatus = todaysLogs.length > 0 ? todaysLogs[0].type : 'OUT';
                return (
                    <div className="space-y-6 animate-fade-in pb-20">
                        <header><h2 className="text-2xl font-bold text-slate-800">My Attendance</h2></header>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div className="md:col-span-2 bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col items-center justify-center text-center space-y-6 min-h-[300px]">
                                <h3 className="text-lg font-medium text-slate-700">{lastStatus === 'IN' ? 'You are Clocked In' : 'You are Clocked Out'}</h3>
                                <button onClick={() => onMarkAttendance(lastStatus === 'IN' ? 'OUT' : 'IN')} className={`w-40 h-40 rounded-full flex flex-col items-center justify-center gap-2 transition-all transform active:scale-95 shadow-xl border-8 ${lastStatus === 'IN' ? 'bg-red-50 border-red-100 text-red-600' : 'bg-green-50 border-green-100 text-green-600'}`}>
                                    <div className={`p-3 rounded-full ${lastStatus === 'IN' ? 'bg-red-200' : 'bg-green-200'}`}>{lastStatus === 'IN' ? <Lucide.LogOut size={24} /> : <Lucide.LogIn size={24} />}</div>
                                    <span className="font-bold">{lastStatus === 'IN' ? 'PUNCH OUT' : 'PUNCH IN'}</span>
                                </button>
                            </div>
                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 h-[300px] overflow-auto">
                                <h3 className="font-semibold text-slate-700 mb-2">Today's Logs</h3>

                                    <div key={log.id} className="flex items-center gap-3 p-2 border-b border-slate-50">
                                        <div className={`w-2 h-2 rounded-full ${log.type === 'IN' ? 'bg-green-500' : 'bg-red-500'}`} />
                                        <div className="text-sm"><span className="font-bold">{log.type === 'IN' ? 'IN' : 'OUT'}</span> <span className="text-slate-400 text-xs">{new Date(log.timestamp?.toDate()).toLocaleTimeString()}</span></div>

                        </div>

                <div className="space-y-6 animate-fade-in pb-20">

                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <table className="w-full text-sm text-left">
                            <thead className="bg-slate-50 text-slate-500 uppercase text-xs"><tr><th className="px-6 py-3">Employee</th><th className="px-6 py-3">Status Today</th><th className="px-6 py-3">Last Active</th></tr></thead>
                            <tbody className="divide-y divide-slate-100">
                                {allUsers.map(u => {
                                    if(u.id === user.uid) return null; // Skip self in admin view
                                    const userLogs = attendanceLogs.filter(l => l.userId === u.id && new Date(l.timestamp?.toDate()).toLocaleDateString() === today);
                                    const isPresent = userLogs.some(l => l.type === 'IN');
                                    return (
                                        <tr key={u.id} className="hover:bg-slate-50">
                                            <td className="px-6 py-4 font-medium">{u.name}</td>
                                            <td className="px-6 py-4"><span className={`px-2 py-1 rounded text-xs font-bold ${isPresent ? 'bg-green-100 text-green-700' : 'bg-red-50 text-red-600'}`}>{isPresent ? 'Present' : 'Absent'}</span></td>
                                            <td className="px-6 py-4 text-slate-500">{u.lastActive ? new Date(u.lastActive.toDate()).toLocaleTimeString() : 'N/A'}</td>
                                        </tr>
                                    );

                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const HelpDeskModule = ({ user, tickets, onRaiseTicket, onUpdateStatus }) => {
            const [subject, setSubject] = useState('');
            const [category, setCategory] = useState('IT Support');
            const [desc, setDesc] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                if(!subject) return;
                onRaiseTicket({ subject, category, description: desc, status: 'Open', userId: user.uid, userName: user.name, timestamp: serverTimestamp() });
                setSubject(''); setDesc('');
            };

            const myTickets = user.role === 'Admin' ? tickets : tickets.filter(t => t.userId === user.uid);

            return (
                <div className="space-y-6 pb-20 animate-fade-in">
                    <header>
                        <h2 className="text-2xl font-bold text-slate-800">Help Desk</h2>
                    </header>
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                            <h3 className="font-bold text-slate-700 mb-4">Raise New Ticket</h3>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <select className="w-full border p-2 rounded text-base bg-white" value={category} onChange={e=>setCategory(e.target.value)}>
                                    <option>IT Support</option><option>HR Query</option><option>Facility/Maintenance</option><option>Accounts</option>
                                </select>
                                <input type="text" className="w-full border p-2 rounded text-base" placeholder="Subject" value={subject} onChange={e=>setSubject(e.target.value)} required />
                                <textarea className="w-full border p-2 rounded text-base h-32 resize-none" placeholder="Describe the issue..." value={desc} onChange={e=>setDesc(e.target.value)} required></textarea>
                                <button className="w-full bg-blue-900 text-white py-2 rounded font-medium">Submit Ticket</button>
                            </form>
                        </div>
                        <div className="lg:col-span-2 space-y-4">
                            {myTickets.map(ticket => (
                                <div key={ticket.id} className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                                    <div className="flex justify-between items-start">
                                        <div>
                                            <div className="flex items-center gap-2 mb-1">
                                                <span className="text-xs font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-600">{ticket.category}</span>
                                                <span className={`text-xs font-bold px-2 py-0.5 rounded ${ticket.status==='Open'?'bg-green-100 text-green-700': ticket.status==='Resolved' ? 'bg-blue-100 text-blue-700' : 'bg-slate-100 text-slate-500'}`}>{ticket.status}</span>
                                            </div>
                                            <h4 className="font-bold text-slate-800">{ticket.subject}</h4>
                                            <p className="text-sm text-slate-500 mt-1">{ticket.description}</p>
                                            {user.role === 'Admin' && <p className="text-xs text-blue-600 mt-1 font-bold">Raised by: {ticket.userName}</p>}
                                        </div>
                                        <div className="text-right">
                                            <p className="text-xs text-slate-400 mb-2">{new Date(ticket.timestamp?.toDate()).toLocaleDateString()}</p>
