                                                <select 
                                                    className="text-xs border p-1 rounded bg-slate-50"
                                                    value={ticket.status}
                                                    onChange={(e) => onUpdateStatus(ticket.id, e.target.value)}
                                                >
                                                    <option value="Open">Open</option>
                                                    <option value="In Progress">In Progress</option>
                                                    <option value="Resolved">Resolved</option>
                                                </select>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            ))}
                            {myTickets.length === 0 && <div className="text-center py-10 text-slate-400 bg-white rounded-xl border border-dashed border-slate-200">No active tickets.</div>}
                        </div>
                    </div>
                </div>
            );
        };

        const NoticesModule = ({ user, announcements, onPostNotice, onDeleteNotice }) => {
            const [title, setTitle] = useState('');
            const [content, setContent] = useState('');
            const [type, setType] = useState('General');

            const handlePost = (e) => {
                e.preventDefault();
                onPostNotice({ title, content, type, author: user.name, timestamp: serverTimestamp() });
                setTitle(''); setContent('');
            };

            return (
                <div className="space-y-6 pb-20 animate-fade-in">
                    <header><h2 className="text-2xl font-bold text-slate-800">Notice Board</h2></header>
                    {user.role === 'Admin' && (
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                            <form onSubmit={handlePost} className="space-y-4">
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <input type="text" className="col-span-2 border p-2 rounded" placeholder="Notice Title" value={title} onChange={e=>setTitle(e.target.value)} required />
                                    <select className="border p-2 rounded" value={type} onChange={e=>setType(e.target.value)}><option>General</option><option>Urgent</option><option>Event</option><option>Holiday</option></select>
                                </div>
                                <textarea className="w-full border p-2 rounded h-24" placeholder="Content..." value={content} onChange={e=>setContent(e.target.value)} required></textarea>
                                <button className="bg-blue-900 text-white px-6 py-2 rounded">Post Notice</button>
                            </form>
                        </div>
                    )}
                    <div className="space-y-4">
                        {announcements.map(ann => (
                            <div key={ann.id} className="bg-white p-4 rounded-lg border border-slate-200 flex justify-between items-start">
                                <div>
                                    <h4 className="font-bold">{ann.title} <span className="text-xs bg-slate-100 px-2 rounded ml-2 font-normal">{ann.type}</span></h4>
                                    <p className="text-sm text-slate-600 mt-1">{ann.content}</p>
                                </div>
                                {user.role === 'Admin' && <button onClick={()=>onDeleteNotice(ann.id)} className="text-red-500 text-xs hover:underline">Delete</button>}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // --- PREVIOUS MODULES (Standard) ---
        const AdminUserManagement = ({ allUsers, onAddUser, onDeleteUser }) => {
            const [newName, setNewName] = useState('');
            const [newEmail, setNewEmail] = useState('');
            const [newRole, setNewRole] = useState('Employee');
            const [newLocation, setNewLocation] = useState('Delhi Unit');
            const [newPhoto, setNewPhoto] = useState('');
            const [isAdding, setIsAdding] = useState(false);

            const handleAdd = (e) => {
                e.preventDefault();
                if (!newEmail || !newName) return;
                if (allUsers.some(u => u.email === newEmail)) { alert("User already exists!"); return; }
                onAddUser({ name: newName, email: newEmail.toLowerCase().trim(), role: newRole, location: newLocation, photoURL: newPhoto, createdAt: serverTimestamp() });
                setNewName(''); setNewEmail(''); setNewPhoto(''); setIsAdding(false);
            };

            return (
                <div className="space-y-6 pb-20 animate-fade-in">
                    <header className="flex flex-col md:flex-row justify-between md:items-center gap-4">
                        <h2 className="text-2xl font-bold text-slate-800">User Management</h2>
                        <button onClick={() => setIsAdding(!isAdding)} className="bg-blue-900 text-white px-4 py-2 rounded-lg flex items-center gap-2 hover:bg-blue-800 transition-colors self-start md:self-auto shadow-sm">
                            {isAdding ? <Lucide.X size={18} /> : <Lucide.UserPlus size={18} />} {isAdding ? 'Cancel' : 'Add User'}
                        </button>
                    </header>
                    {isAdding && (
                        <div className="bg-white p-6 rounded-xl border border-blue-100 shadow-lg animate-fade-in">
                            <form onSubmit={handleAdd} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <input type="text" required className="w-full px-3 py-2 border rounded-lg text-base" value={newName} onChange={e => setNewName(e.target.value)} placeholder="Full Name" />
                                <input type="email" required className="w-full px-3 py-2 border rounded-lg text-base" value={newEmail} onChange={e => setNewEmail(e.target.value)} placeholder="Email" />
                                <select className="w-full px-3 py-2 border rounded-lg bg-white text-base" value={newRole} onChange={e => setNewRole(e.target.value)}><option>Employee</option><option>Manager</option><option>Director</option><option>Business Partner</option></select>
                                <select className="w-full px-3 py-2 border rounded-lg bg-white text-base" value={newLocation} onChange={e => setNewLocation(e.target.value)}><option>Delhi Unit</option><option>Mumbai HQ</option><option>Bangalore Hub</option><option>Remote</option></select>
                                <div className="md:col-span-2"><input type="text" className="w-full px-3 py-2 border rounded-lg text-base" value={newPhoto} onChange={e => setNewPhoto(e.target.value)} placeholder="Profile Photo URL (Optional)" /></div>
                                <button className="md:col-span-2 w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-medium mt-2">Confirm Registration</button>
                            </form>
                        </div>
                    )}
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm text-left min-w-[600px]">
                                <thead className="bg-slate-50 text-slate-500 uppercase text-xs font-semibold"><tr><th className="px-6 py-3">Employee</th><th className="px-6 py-3">Role</th><th className="px-6 py-3">Email</th><th className="px-6 py-3 text-right">Actions</th></tr></thead>
                                <tbody className="divide-y divide-slate-100">
                                    {allUsers.map(user => (
                                        <tr key={user.id} className="hover:bg-slate-50 transition-colors">
                                            <td className="px-6 py-4 flex items-center gap-3"><div className="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center overflow-hidden flex-shrink-0">{user.photoURL ? <img src={user.photoURL} alt="" className="w-full h-full object-cover" /> : <span className="text-xs font-bold text-slate-500">{user.name.charAt(0)}</span>}</div><span className="font-medium text-slate-900">{user.name}</span></td>
                                            <td className="px-6 py-4"><span className="px-2 py-1 rounded text-xs font-bold border bg-slate-100 text-slate-600 whitespace-nowrap">{user.role}</span></td>
                                            <td className="px-6 py-4 text-slate-500">{user.email}</td>
                                            <td className="px-6 py-4 text-right">{user.email !== MASTER_ADMIN_EMAIL && <button onClick={() => {if(confirm('Delete user?')) onDeleteUser(user.id)}} className="text-red-500 hover:underline">Remove</button>}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const TaskBoard = ({ user, tasks, onAddTask, onUpdateTaskStatus, onDeleteTask }) => {
            const [newTaskTitle, setNewTaskTitle] = useState('');
            const [newTaskAssignee, setNewTaskAssignee] = useState('');
            const [isAdding, setIsAdding] = useState(false);
            const columns = [{ id: 'todo', label: 'To Do', color: 'bg-slate-50' }, { id: 'in_progress', label: 'In Progress', color: 'bg-blue-50' }, { id: 'done', label: 'Completed', color: 'bg-green-50' }];

            const handleAdd = (e) => {
                e.preventDefault();
                if (!newTaskTitle.trim()) return;
                onAddTask({ title: newTaskTitle, assignee: newTaskAssignee || 'Anyone', status: 'todo', createdBy: user.name, createdAt: serverTimestamp() });
                setNewTaskTitle(''); setNewTaskAssignee(''); setIsAdding(false);
            };

            const handleStatusChange = (id, status) => {
                const updateData = { status };
                if (status === 'done') {
                    updateData.completedAt = serverTimestamp();
                }
                onUpdateTaskStatus(id, updateData);
            };

            return (
                <div className="space-y-6 pb-4 h-full flex flex-col animate-fade-in">
                    <header className="flex justify-between items-center">
                        <h2 className="text-2xl font-bold text-slate-800">Task Board</h2>
                        <button onClick={() => setIsAdding(!isAdding)} className="bg-blue-900 text-white px-4 py-2 rounded-lg flex items-center gap-2 shadow-sm">{isAdding ? <Lucide.X size={18}/> : <Lucide.Plus size={18}/>} <span className="hidden md:inline">New Task</span><span className="md:hidden">Add</span></button>
                    </header>
                    {isAdding && (
                        <form onSubmit={handleAdd} className="bg-white p-4 rounded-xl border border-blue-100 shadow-lg flex flex-col md:flex-row gap-3">
                            <input type="text" placeholder="Task Description" className="flex-1 px-4 py-2 border rounded-lg text-base" value={newTaskTitle} onChange={e => setNewTaskTitle(e.target.value)} autoFocus />
                            <input type="text" placeholder="Assign To (Name)" className="md:w-48 px-4 py-2 border rounded-lg text-base" value={newTaskAssignee} onChange={e => setNewTaskAssignee(e.target.value)} />
                            <button className="bg-green-600 text-white px-6 py-2 rounded-lg">Add</button>
                        </form>
                    )}
                    <div className="flex-1 overflow-x-auto pb-2">
                        <div className="flex gap-4 min-w-[800px] h-full">
                            {columns.map(col => (
                                <div key={col.id} className={`flex-1 rounded-xl p-4 flex flex-col gap-3 ${col.color} border border-slate-200`}>
                                    <h3 className="font-bold text-slate-700 border-b pb-2">{col.label}</h3>
                                    <div className="flex-1 overflow-y-auto space-y-3 custom-scrollbar">
                                        {tasks.filter(t => t.status === col.id).map(task => (
                                            <div key={task.id} className="bg-white p-3 rounded-lg shadow-sm border border-slate-100 group hover:shadow-md transition-all">
                                                <div className="flex justify-between items-start mb-1">
                                                    <p className="font-medium text-sm text-slate-800">{task.title}</p>
                                                    {(user.role === 'Admin' || task.createdBy === user.name) && (
                                                        <button onClick={() => onDeleteTask(task.id)} className="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"><Lucide.Trash2 size={14}/></button>
                                                    )}
                                                </div>
                                                <div className="flex justify-between items-end mt-2">
                                                    <div className="text-xs bg-slate-100 px-2 py-1 rounded text-slate-600 flex items-center gap-1"><Lucide.User size={10}/> {task.assignee}</div>
                                                    
                                                    {col.id !== 'done' && (
                                                        <button onClick={() => handleStatusChange(task.id, col.id === 'todo' ? 'in_progress' : 'done')} className="text-xs text-blue-600 hover:underline">Next &rarr;</button>
                                                    )}
                                                    
                                                    {/* Admin Override for status */}
                                                    {user.role === 'Admin' && col.id === 'done' && (
                                                        <span className="text-xs text-green-600 font-bold flex items-center gap-1"><Lucide.Check size={10}/> Done</span>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const AvailabilityModule = ({ user, leaves, onAddLeave }) => {
            const [fromDate, setFromDate] = useState('');
            const [toDate, setToDate] = useState('');
            const [reason, setReason] = useState('');
            const handleSubmit = (e) => {
                e.preventDefault();
                if (!fromDate || !toDate) return;
                onAddLeave({ userId: user.uid, userName: user.name, location: user.location, from: fromDate, to: toDate, reason, status: 'Pending' });
                setFromDate(''); setToDate(''); setReason('');
            };

            return (
                <div className="space-y-6 pb-20 animate-fade-in">
                    <header><h2 className="text-2xl font-bold text-slate-800">Leaves & Vacancy</h2></header>
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                            <h3 className="font-semibold mb-4">Request Leave</h3>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div className="grid grid-cols-2 gap-2">
                                    <input type="date" required className="border p-2 rounded text-base" value={fromDate} onChange={e => setFromDate(e.target.value)} />
                                    <input type="date" required className="border p-2 rounded text-base" value={toDate} onChange={e => setToDate(e.target.value)} />
                                </div>
                                <textarea className="w-full border p-2 rounded text-base h-20" placeholder="Reason..." value={reason} onChange={e => setReason(e.target.value)} />
                                <button className="w-full bg-blue-900 text-white py-2 rounded text-sm">Submit</button>
                            </form>
                        </div>
                        <div className="lg:col-span-2 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                            <div className="p-4 bg-slate-50 border-b border-slate-100 font-semibold text-sm">Leave History</div>
                            <div className="max-h-[300px] overflow-auto">
                                <table className="w-full text-sm text-left min-w-[500px]">
                                    <thead className="text-xs text-slate-500 uppercase bg-slate-50"><tr><th className="px-4 py-2">Name</th><th className="px-4 py-2">Dates</th><th className="px-4 py-2">Status</th></tr></thead>
                                    <tbody>
                                        {leaves.map((l, i) => (
                                            <tr key={i} className="border-b hover:bg-slate-50"><td className="px-4 py-2">{l.userName}</td><td className="px-4 py-2 text-xs">{l.from} to {l.to}</td><td className="px-4 py-2"><span className="bg-yellow-100 text-yellow-800 text-xs px-2 py-1 rounded border border-yellow-200">{l.status}</span></td></tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const EODModule = ({ user, reports, onSubmitReport }) => {
            const [content, setContent] = useState('');
            const handleSubmit = (e) => {
                e.preventDefault();
                if(!content.trim()) return;
                onSubmitReport({ userId: user.uid, userName: user.name, role: user.role, date: new Date().toLocaleDateString(), content, timestamp: serverTimestamp() });
                setContent('');
            };
            return (
                <div className="space-y-6 pb-20 animate-fade-in">
                    <header><h2 className="text-2xl font-bold text-slate-800">End of Day Reports</h2></header>
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                            <h3 className="font-semibold mb-4">Submit Report</h3>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <textarea className="w-full border p-3 rounded h-40 resize-none text-base bg-slate-50 focus:bg-white transition-colors" placeholder="Work done today..." value={content} onChange={e => setContent(e.target.value)} />
                                <button className="w-full bg-blue-900 text-white py-2 rounded text-sm">Submit</button>
                            </form>
                        </div>
                        <div className="lg:col-span-2 bg-white rounded-xl shadow-sm border border-slate-200 p-4 h-[500px] overflow-auto space-y-4">
                            <h3 className="font-semibold text-slate-800">Team Submissions</h3>
                            {reports.map(r => (
                                <div key={r.id} className="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                    <div className="flex justify-between mb-2">
                                        <span className="font-bold text-sm text-blue-900">{r.userName}</span>
                                        <span className="text-xs text-slate-400">{r.date}</span>
                                    </div>
                                    <p className="text-sm text-slate-700 whitespace-pre-wrap">{r.content}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const ChatModule = ({ user, messages, onSendMessage }) => {
            const [text, setText] = useState('');
            const [isUploading, setIsUploading] = useState(false);
            const fileInputRef = useRef(null);
            const bottomRef = useRef(null);
            
            useEffect(() => { bottomRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages]);

            const handleSend = (e) => {
                e.preventDefault();
                if(!text.trim()) return;
                onSendMessage({ text, type: 'text', userId: user.uid, userName: user.name, userPhoto: user.photoURL || '', timestamp: serverTimestamp() });
                setText('');
            };

            const handleFileSelect = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.type !== 'application/pdf') { alert('Only PDF files are allowed.'); return; }
                if (file.size > 500 * 1024) { alert('File too large! Please upload PDFs smaller than 500KB.'); return; }
                setIsUploading(true);
                const reader = new FileReader();
                reader.onloadend = () => {
                    onSendMessage({ text: 'Shared a PDF file', type: 'pdf', fileName: file.name, fileData: reader.result, userId: user.uid, userName: user.name, userPhoto: user.photoURL || '', timestamp: serverTimestamp() });
                    setIsUploading(false); e.target.value = null;
                };
                reader.readAsDataURL(file);
            };

            return (
                <div className="h-[calc(100vh-140px)] md:h-[calc(100vh-100px)] flex flex-col bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden animate-fade-in">
                    <div className="p-4 bg-white border-b border-slate-100 font-bold text-slate-700 flex items-center gap-2">
                        <Lucide.MessageSquare size={18} className="text-blue-600"/> Group Chat
                    </div>
                    <div className="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50/30">
                        {messages.map(m => (
                            <div key={m.id} className={`flex gap-2 ${m.userId === user.uid ? 'flex-row-reverse' : 'flex-row'}`}>
                                <div className="w-8 h-8 rounded-full bg-slate-200 flex-shrink-0 overflow-hidden shadow-sm">
                                     {m.userPhoto ? <img src={m.userPhoto} className="w-full h-full object-cover"/> : <div className="w-full h-full flex items-center justify-center text-xs font-bold text-slate-500">{m.userName.charAt(0)}</div>}
                                </div>
                                <div className={`max-w-[75%] p-3 rounded-2xl text-sm shadow-sm ${m.userId === user.uid ? 'bg-blue-600 text-white rounded-tr-none' : 'bg-white border border-slate-100 text-slate-800 rounded-tl-none'}`}>
                                    <p className="font-bold text-xs opacity-70 mb-1">{m.userName}</p>
                                    {m.type === 'pdf' ? (
                                        <div className="flex items-center gap-2 bg-black/10 p-2 rounded-lg">
                                            <Lucide.FileText size={24} className="flex-shrink-0" />
                                            <div className="overflow-hidden">
                                                <p className="truncate font-medium">{m.fileName}</p>
                                                <a href={m.fileData} download={m.fileName} className="text-xs underline hover:no-underline font-bold mt-1 inline-block">Download PDF</a>
                                            </div>
                                        </div>
                                    ) : (<p>{m.text}</p>)}
                                </div>
                            </div>
                        ))}
                        <div ref={bottomRef} />
                    </div>
                    <form onSubmit={handleSend} className="p-3 md:p-4 border-t border-slate-100 bg-white flex gap-2 items-center">
                        <input type="file" accept="application/pdf" className="hidden" ref={fileInputRef} onChange={handleFileSelect} />
                        <button type="button" onClick={() => fileInputRef.current.click()} className="text-slate-400 hover:text-blue-600 p-2 rounded-full transition-colors bg-slate-50" disabled={isUploading}>
                            {isUploading ? <Lucide.Loader2 size={20} className="animate-spin"/> : <Lucide.Paperclip size={20}/>}
                        </button>
                        <input type="text" className="flex-1 bg-slate-50 border-0 rounded-full px-4 py-2.5 text-base md:text-sm focus:ring-2 focus:ring-blue-100" placeholder="Type a message..." value={text} onChange={e => setText(e.target.value)} />
                        <button className="bg-blue-600 text-white p-2.5 rounded-full hover:bg-blue-700 flex-shrink-0 shadow-md shadow-blue-200"><Lucide.Send size={18}/></button>
                    </form>
                </div>
            );
        };

        const ProgressModule = ({ user, tasks, attendanceLogs, reports }) => {
            const myTasks = tasks.filter(t => t.assignee === user.name);
            const completed = myTasks.filter(t => t.status === 'done').length;
            const total = myTasks.length;
            const progress = total === 0 ? 0 : Math.round((completed / total) * 100);
            const presentDays = attendanceLogs.filter(l => l.userId === user.uid && l.type === 'IN').length;

            return (
                <div className="space-y-6 pb-20 animate-fade-in">
                    <header><h2 className="text-2xl font-bold text-slate-800">My Progress</h2></header>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 relative overflow-hidden">
                            <div className="absolute right-0 top-0 w-24 h-24 bg-blue-50 rounded-full -mr-8 -mt-8"></div>
                            <h3 className="text-slate-500 text-xs font-bold uppercase mb-2 relative z-10">Task Efficiency</h3>
                            <div className="flex items-end gap-2 mb-2 relative z-10">
                                <span className="text-4xl font-bold text-blue-600">{progress}%</span>
                            </div>
                            <div className="w-full bg-slate-100 rounded-full h-2 relative z-10">
                                <div className="bg-blue-600 h-2 rounded-full transition-all duration-1000" style={{width: `${progress}%`}}></div>
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <h3 className="text-slate-500 text-xs font-bold uppercase mb-2">Attendance Streak</h3>
                            <div className="flex items-center gap-3">
                                <div className="p-3 bg-green-100 text-green-600 rounded-xl"><Lucide.CalendarCheck size={24} /></div>
                                <div><span className="text-2xl font-bold text-slate-800">{presentDays}</span><p className="text-xs text-slate-500">Days Present</p></div>
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <h3 className="text-slate-500 text-xs font-bold uppercase mb-2">Reports Submitted</h3>
                            <div className="flex items-center gap-3">
                                <div className="p-3 bg-purple-100 text-purple-600 rounded-xl"><Lucide.FileText size={24} /></div>
                                <div><span className="text-2xl font-bold text-slate-800">{reports.filter(r => r.userId === user.uid).length}</span><p className="text-xs text-slate-500">EODs Filed</p></div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const IdeaHubModule = ({ user, ideas, onSubmitIdea }) => {
            const [title, setTitle] = useState('');
            const [desc, setDesc] = useState('');
            const [category, setCategory] = useState('Process Improvement');

            const handleSubmit = (e) => {
                e.preventDefault();
                if(!title || !desc) return;
                onSubmitIdea({ title, description: desc, category, userId: user.uid, userName: user.name, votes: 0, timestamp: serverTimestamp() });
                setTitle(''); setDesc('');
            };

            return (
                <div className="space-y-6 pb-20 animate-fade-in">
                    <header>
                        <h2 className="text-2xl font-bold text-slate-800">Idea Hub</h2>
                        <p className="text-slate-500">Work Process Idea Center</p>
                    </header>
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                            <h3 className="font-bold text-slate-700 mb-4 flex items-center gap-2"><Lucide.Lightbulb size={18} className="text-yellow-500"/> Submit Idea</h3>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <input type="text" className="w-full border p-2 rounded text-base" placeholder="Title" value={title} onChange={e=>setTitle(e.target.value)} required />
                                <select className="w-full border p-2 rounded text-base bg-white" value={category} onChange={e=>setCategory(e.target.value)}>
                                    <option>Process Improvement</option><option>Cost Saving</option><option>Culture</option><option>Safety</option>
                                </select>
                                <textarea className="w-full border p-2 rounded text-base h-32 resize-none" placeholder="Description..." value={desc} onChange={e=>setDesc(e.target.value)} required></textarea>
                                <button className="w-full bg-blue-900 text-white py-2 rounded font-medium">Submit</button>
                            </form>
                        </div>
                        <div className="lg:col-span-2 space-y-4">
                            {ideas.map(idea => (
                                <div key={idea.id} className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 hover:shadow-md transition-shadow">
                                    <div className="flex justify-between items-start mb-2"><span className="bg-blue-50 text-blue-700 text-xs px-2 py-1 rounded font-bold">{idea.category}</span><span className="text-xs text-slate-400">{idea.userName}</span></div>
                                    <h4 className="font-bold text-slate-800 text-lg mb-1">{idea.title}</h4>
                                    <p className="text-slate-600 text-sm">{idea.description}</p>
                                </div>
                            ))}
                            {ideas.length === 0 && <div className="text-center py-10 text-slate-400">No ideas yet. Share yours!</div>}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            if (!isConfigured) return <ConfigErrorScreen />;

            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null);
            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [sidebarOpen, setSidebarOpen] = useState(false);
            
            // Data
            const [attendanceLogs, setAttendanceLogs] = useState([]);
            const [tasks, setTasks] = useState([]);
            const [leaves, setLeaves] = useState([]);
            const [reports, setReports] = useState([]);
            const [allUsers, setAllUsers] = useState([]);
            const [messages, setMessages] = useState([]);
            const [ideas, setIdeas] = useState([]);
            const [announcements, setAnnouncements] = useState([]);
            const [tickets, setTickets] = useState([]);

            // Persistent Login
            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, async (u) => {
                    if (u) { 
                        setUser(u);
                        try {
                            const q = query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'users'), where("uid", "==", u.uid));
                            const snapshot = await getDocs(q);
                            if (!snapshot.empty) {
                                setProfile({ ...snapshot.docs[0].data(), docId: snapshot.docs[0].id });
                            }
                        } catch (e) { console.error("Profile fetch error", e); }
                    } else { setUser(null); setProfile(null); }
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            // Data Sync & Logic
            useEffect(() => {
                if (!user || !profile) return;
                
                const unsub1 = onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', 'attendance'), s => setAttendanceLogs(s.docs.map(d => ({id: d.id, ...d.data()}))));
                
                // Tasks Listener & Auto-Delete Logic
                const unsub2 = onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', 'tasks'), s => {
                    const taskList = s.docs.map(d => ({id: d.id, ...d.data()}));
                    setTasks(taskList);
                    
                    // Auto-delete completed tasks older than 24 hours (Only Admin triggers this to save writes)
                    if (profile.role === 'Admin') {
                        const now = Date.now();
                        taskList.forEach(task => {
                            if (task.status === 'done' && task.completedAt) {
                                const completedTime = task.completedAt.toDate().getTime();
                                if (now - completedTime > 24 * 60 * 60 * 1000) { // 24 hours
                                    deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'tasks', task.id));
                                }
                            }
                        });
                    }
                });

                const unsub3 = onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', 'leaves'), s => setLeaves(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsub4 = onSnapshot(query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'daily_reports'), orderBy('timestamp', 'desc')), s => setReports(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsub5 = onSnapshot(query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'messages'), orderBy('timestamp', 'asc')), s => {
                    const newMessages = s.docs.map(d => ({id: d.id, ...d.data()}));
                    setMessages(newMessages);
                    if (!s.empty) {
                        const lastMsg = newMessages[newMessages.length - 1];
                        const now = new Date();
                        const msgTime = lastMsg.timestamp?.toDate ? lastMsg.timestamp.toDate() : new Date();
                        if (lastMsg.userId !== user.uid && (now - msgTime) < 10000 && s.docChanges().some(c => c.type === 'added' && c.doc.id === lastMsg.id)) {
                            sendNotification(`New Message from ${lastMsg.userName}`, lastMsg.type === 'pdf' ? 'Shared a PDF File' : lastMsg.text);
                        }
                    }
                });
                const unsub7 = onSnapshot(query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'ideas'), orderBy('timestamp', 'desc')), s => setIdeas(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsub8 = onSnapshot(query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'notices'), orderBy('timestamp', 'desc')), s => setAnnouncements(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsub9 = onSnapshot(query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'tickets'), orderBy('timestamp', 'desc')), s => setTickets(s.docs.map(d => ({id: d.id, ...d.data()}))));

                let unsub6 = () => {};
                if (profile.role === 'Admin') {
                    unsub6 = onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', 'users'), s => setAllUsers(s.docs.map(d => ({id: d.id, ...d.data()}))));
                } else {
                    setAllUsers([]);
                }
                
                return () => { unsub1(); unsub2(); unsub3(); unsub4(); unsub5(); unsub6(); unsub7(); unsub8(); unsub9(); };
            }, [user, profile]);

            const handleLogout = async () => { await signOut(auth); setProfile(null); };

            if (loading) return <LoadingScreen />;
            if (!user || !profile) return <LoginScreen onJoin={setProfile} />;

            const NavItem = ({ id, icon: Icon, label }) => (
                <button onClick={() => { setActiveTab(id); setSidebarOpen(false); }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all font-medium text-sm ${activeTab === id ? 'bg-white text-blue-900 shadow-sm' : 'text-blue-200 hover:bg-white/10'}`}>
                    <Icon size={18} /> <span>{label}</span>
                </button>
            );

            return (
                <div className="h-screen bg-slate-50 flex overflow-hidden">
                    {sidebarOpen && <div className="fixed inset-0 bg-black/60 z-40 lg:hidden backdrop-blur-sm" onClick={() => setSidebarOpen(false)} />}
                    <aside className={`fixed lg:static inset-y-0 left-0 z-50 w-72 bg-blue-900 text-white flex flex-col transition-transform duration-300 shadow-2xl ${sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'}`}>
                        <div className="p-8 pb-6">
                            <div className="flex items-center gap-3 mb-6">
                                <div className="bg-white/20 p-1 rounded-lg backdrop-blur-sm"><img src={LOGO_URL} alt="Logo" className="w-8 h-8 object-contain" /></div>
                                <div><h1 className="font-bold text-xl tracking-tight">Varun Dynamics</h1><p className="text-xs text-blue-200 opacity-80">Enterprise System</p></div>
                            </div>
                            <div className="bg-white/10 p-3 rounded-xl flex items-center gap-3 border border-white/5">
                                <div className="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center font-bold text-sm overflow-hidden border-2 border-blue-400">
                                    {profile.photoURL ? <img src={profile.photoURL} className="w-full h-full object-cover"/> : profile.name.charAt(0)}
                                </div>
                                <div className="overflow-hidden"><p className="font-bold text-sm truncate">{profile.name}</p><p className="text-xs text-blue-200 truncate">{profile.role}</p></div>
                            </div>
                        </div>
                        <nav className="flex-1 px-4 space-y-1 overflow-y-auto custom-scrollbar pb-6">
                            <p className="px-4 text-xs font-bold text-blue-300 uppercase tracking-wider mb-2 mt-2">Main</p>
                            <NavItem id="dashboard" icon={Lucide.LayoutDashboard} label="Dashboard" />
                            <NavItem id="notices" icon={Lucide.Megaphone} label="Notice Board" />
                            
                            <p className="px-4 text-xs font-bold text-blue-300 uppercase tracking-wider mb-2 mt-6">Work</p>
                            <NavItem id="attendance" icon={Lucide.Clock} label="Attendance" />
                            <NavItem id="tasks" icon={Lucide.CheckSquare} label="Task Board" />
                            <NavItem id="leaves" icon={Lucide.CalendarDays} label="Leaves" />
                            <NavItem id="eod" icon={Lucide.FileText} label="Daily Reports" />
                            
                            <p className="px-4 text-xs font-bold text-blue-300 uppercase tracking-wider mb-2 mt-6">Connect</p>
                            <NavItem id="chat" icon={Lucide.MessageSquare} label="Group Chat" />
                            <NavItem id="ideas" icon={Lucide.Lightbulb} label="Idea Hub" />
                            <NavItem id="progress" icon={Lucide.BarChart2} label="My Progress" />
                            
                            <p className="px-4 text-xs font-bold text-blue-300 uppercase tracking-wider mb-2 mt-6">Support</p>
                            <NavItem id="payroll" icon={Lucide.Wallet} label="Payroll" />
                            <NavItem id="helpdesk" icon={Lucide.LifeBuoy} label="Help Desk" />
                            
                            {profile.role === 'Admin' && (
                                <>
                                    <p className="px-4 text-xs font-bold text-blue-300 uppercase tracking-wider mb-2 mt-6">Admin</p>
                                    <NavItem id="users" icon={Lucide.Users} label="User Management" />
                                    <NavItem id="payroll-manager" icon={Lucide.DollarSign} label="Payroll Manager" />
                                </>
                            )}
                        </nav>
                        <div className="p-4 bg-blue-950/50"><button onClick={handleLogout} className="w-full flex items-center justify-center gap-2 text-red-200 hover:text-white hover:bg-red-500/20 py-3 rounded-xl text-sm transition-all"><Lucide.LogOut size={16} /> Sign Out</button></div>
                    </aside>

                    <main className="flex-1 flex flex-col h-screen overflow-hidden relative">
                        <header className="bg-white/80 backdrop-blur-md border-b border-slate-200 p-4 flex items-center justify-between lg:hidden shadow-sm z-30 sticky top-0">
                            <button onClick={() => setSidebarOpen(true)} className="text-slate-600 p-2"><Lucide.Menu size={24} /></button>
                            <span className="font-bold text-slate-800">Varun Dynamics</span>
                            <div className="w-8" />
                        </header>
                        <div className="flex-1 overflow-auto p-4 lg:p-8 relative">
                            <div className="max-w-6xl mx-auto h-full">
                                {activeTab === 'dashboard' && <Dashboard user={{...profile, uid: user.uid}} attendanceLogs={attendanceLogs} tasks={tasks} leaves={leaves} reports={reports} announcements={announcements} setActiveTab={setActiveTab} onMarkAttendance={(type) => addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'attendance'), { userId: user.uid, userName: profile.name, location: profile.location, type, timestamp: serverTimestamp() })} />}
                                {activeTab === 'users' && profile.role === 'Admin' && <AdminUserManagement allUsers={allUsers} onAddUser={(data) => addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'users'), data)} onDeleteUser={(id) => deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'users', id))} />}
                                {activeTab === 'payroll-manager' && profile.role === 'Admin' && <AdminPayrollManager users={allUsers} onUpdateSalary={(uid, salaryConfig) => updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'users', uid), { salaryConfig })} />}
                                {activeTab === 'attendance' && <AttendanceModule user={{...profile, uid: user.uid}} allUsers={allUsers} attendanceLogs={attendanceLogs} onMarkAttendance={(type) => addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'attendance'), { userId: user.uid, userName: profile.name, location: profile.location, type, timestamp: serverTimestamp() })} />}
                                {activeTab === 'tasks' && <TaskBoard user={{...profile, uid: user.uid}} tasks={tasks} onAddTask={(data) => addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'tasks'), data)} onUpdateTaskStatus={(id, status) => updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'tasks', id), status)} onDeleteTask={(id) => deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'tasks', id))} />}
                                {activeTab === 'leaves' && <AvailabilityModule user={{...profile, uid: user.uid}} leaves={leaves} onAddLeave={(data) => addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'leaves'), data)} />}
                                {activeTab === 'eod' && <EODModule user={{...profile, uid: user.uid}} reports={reports} onSubmitReport={(data) => addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'daily_reports'), data)} />}
                                {activeTab === 'chat' && <ChatModule user={{...profile, uid: user.uid}} messages={messages} onSendMessage={(data) => addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'messages'), data)} />}
                                {activeTab === 'progress' && <ProgressModule user={{...profile, uid: user.uid}} tasks={tasks} attendanceLogs={attendanceLogs} reports={reports} />}
                                {activeTab === 'ideas' && <IdeaHubModule user={{...profile, uid: user.uid}} ideas={ideas} onSubmitIdea={(data) => addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'ideas'), data)} />}
                                {activeTab === 'payroll' && <PayrollModule user={{...profile, uid: user.uid}} />}
                                {activeTab === 'helpdesk' && <HelpDeskModule user={{...profile, uid: user.uid}} tickets={tickets} onRaiseTicket={(data) => addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'tickets'), data)} onUpdateStatus={(id, status) => updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'tickets', id), {status})} />}
                                {activeTab === 'notices' && <NoticesModule user={{...profile, uid: user.uid}} announcements={announcements} onPostNotice={(data) => addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'notices'), data)} onDeleteNotice={(id) => deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'notices', id))} />}
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
