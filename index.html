                                {meetings.length === 0 && <div className="text-center py-10 text-[#605e5c]">No upcoming meetings scheduled.</div>}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const TrainingModule = ({ user, trainings, onAddTraining, onMarkComplete, onDeleteTraining }) => {
            const [title, setTitle] = useState('');
            const [desc, setDesc] = useState('');
            const [link, setLink] = useState('');
            
            const handleAdd = (e) => {
                e.preventDefault();
                if(!title || !link) return;
                onAddTraining({ title, description: desc, link, addedBy: user.name, completions: [], timestamp: serverTimestamp() });
                setTitle(''); setDesc(''); setLink('');
            };

            return (
                <div className="space-y-6 pb-20 animate-fade-in">
                    <header>
                        <h2 className="text-2xl font-semibold text-[#323130]">Learning & Training Hub</h2>
                        <p className="text-[#605e5c] text-sm">Enhance your skills with company resources.</p>
                    </header>

                    {user.role === 'Admin' && (
                        <div className="bg-white p-6 rounded shadow-sm border border-[#edebe9]">
                            <h3 className="font-semibold text-[#323130] mb-4">Add Training Resource</h3>
                            <form onSubmit={handleAdd} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <input type="text" className="border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4]" placeholder="Course Title" value={title} onChange={e=>setTitle(e.target.value)} required />
                                <input type="url" className="border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4]" placeholder="Resource Link (Video/Doc)" value={link} onChange={e=>setLink(e.target.value)} required />
                                <div className="md:col-span-2 flex gap-4 items-end">
                                    <input type="text" className="flex-1 border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4]" placeholder="Short Description..." value={desc} onChange={e=>setDesc(e.target.value)} />
                                    <button className="bg-[#107c10] text-white px-6 py-2 rounded font-semibold hover:bg-[#0b5a0b] shadow-sm">Publish Course</button>
                                </div>
                            </form>
                        </div>
                    )}

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {trainings.map(t => {
                            const isCompleted = t.completions && t.completions.includes(user.uid);
                            return (
                                <div key={t.id} className="bg-white p-5 rounded shadow-sm border border-[#edebe9] hover:border-[#0078d4] transition-all flex flex-col relative group">
                                    {user.role === 'Admin' && (
                                        <button onClick={()=>onDeleteTraining(t.id)} className="absolute top-4 right-4 text-[#a19f9d] hover:text-[#a4262c] opacity-0 group-hover:opacity-100 transition-opacity"><Lucide.Trash2 size={16}/></button>
                                    )}
                                    <div className="flex items-start gap-3 mb-3 pr-6">
                                        <div className="p-2 bg-[#f3f2f1] text-[#0078d4] rounded border border-[#edebe9]"><Lucide.GraduationCap size={20}/></div>
                                        <div>
                                            <h4 className="font-semibold text-[#323130] line-clamp-2">{t.title}</h4>
                                            <p className="text-xs text-[#605e5c] mt-1 line-clamp-2">{t.description}</p>
                                        </div>
                                    </div>
                                    <div className="mt-auto pt-4 border-t border-[#edebe9] flex justify-between items-center">
                                        <a href={t.link} target="_blank" rel="noreferrer" className="text-sm text-[#0078d4] font-semibold hover:underline">Start Learning &rarr;</a>
                                        {isCompleted ? (
                                            <span className="text-xs text-[#107c10] font-semibold flex items-center gap-1"><Lucide.CheckCircle size={14}/> Completed</span>
                                        ) : (
                                            <button onClick={()=>{
                                                const newCompletions = t.completions ? [...t.completions, user.uid] : [user.uid];
                                                onMarkComplete(t.id, newCompletions);
                                            }} className="text-xs bg-[#f3f2f1] hover:bg-[#dff6dd] hover:text-[#107c10] px-2 py-1 rounded border border-[#edebe9] transition-colors font-medium">Mark Done</button>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                        {trainings.length === 0 && <div className="col-span-full text-center py-10 text-[#605e5c]">No training modules assigned yet.</div>}
                    </div>
                </div>
            );
        };
        
        const AssetsModule = ({ user, assets, allUsers, onAddAsset, onAssignAsset, onDeleteAsset }) => {
            const [name, setName] = useState('');
            const [type, setType] = useState('Laptop');
            const [serial, setSerial] = useState('');
            
            const handleAdd = (e) => {
                e.preventDefault();
                if(!name || !serial) return;
                onAddAsset({ name, type, serialNumber: serial, status: 'Available', assignedTo: null, assignedName: '', addedAt: serverTimestamp() });
                setName(''); setSerial('');
            };

            const myAssets = assets.filter(a => a.assignedTo === user.uid);

            return (
                <div className="space-y-6 pb-20 animate-fade-in">
                    <header><h2 className="text-2xl font-semibold text-[#323130]">Asset Management</h2></header>
                    
                    {user.role === 'Admin' && (
                        <div className="bg-white p-6 rounded shadow-sm border border-[#edebe9]">
                            <h3 className="font-semibold text-[#323130] mb-4">Add New Asset</h3>
                            <form onSubmit={handleAdd} className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                <input type="text" className="border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4]" placeholder="Asset Name (e.g. MacBook Pro)" value={name} onChange={e=>setName(e.target.value)} required />
                                <select className="border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4]" value={type} onChange={e=>setType(e.target.value)}>
                                    <option>Laptop</option><option>Mobile Phone</option><option>Monitor</option><option>Software License</option><option>Other</option>
                                </select>
                                <input type="text" className="border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4]" placeholder="Serial / License Key" value={serial} onChange={e=>setSerial(e.target.value)} required />
                                <button className="bg-[#0078d4] text-white py-2 rounded font-semibold hover:bg-[#106ebe] shadow-sm">Add Asset</button>
                            </form>
                        </div>
                    )}

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {user.role === 'Admin' ? (
                            <div className="md:col-span-2 bg-white rounded shadow-sm border border-[#edebe9] overflow-hidden">
                                <div className="p-4 bg-[#f3f2f1] border-b border-[#edebe9] font-semibold text-[#323130]">Company Assets Inventory</div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-sm text-left">
                                        <thead className="bg-[#faf9f8] text-[#605e5c] text-xs uppercase">
                                            <tr><th className="px-4 py-3">Asset</th><th className="px-4 py-3">Serial/Key</th><th className="px-4 py-3">Status</th><th className="px-4 py-3">Assignment</th><th className="px-4 py-3 text-right">Actions</th></tr>
                                        </thead>
                                        <tbody className="divide-y divide-[#edebe9]">
                                            {assets.map(a => (
                                                <tr key={a.id} className="hover:bg-[#faf9f8]">
                                                    <td className="px-4 py-3 font-medium text-[#323130]"><div className="flex items-center gap-2"><Lucide.MonitorSmartphone size={16} className="text-[#0078d4]"/> {a.name} <span className="text-xs text-[#605e5c]">({a.type})</span></div></td>
                                                    <td className="px-4 py-3 font-mono text-xs text-[#605e5c]">{a.serialNumber}</td>
                                                    <td className="px-4 py-3"><span className={`px-2 py-1 rounded text-xs font-semibold ${a.status==='Available'?'bg-[#dff6dd] text-[#107c10]':'bg-[#eff6fc] text-[#0078d4]'}`}>{a.status}</span></td>
                                                    <td className="px-4 py-3">
                                                        {a.status === 'Available' ? (
                                                            <select className="text-xs border border-[#8a8886] rounded p-1" onChange={(e) => {
                                                                const uid = e.target.value;
                                                                if(!uid) return;
                                                                const emp = allUsers.find(u=>u.id===uid);
                                                                onAssignAsset(a.id, {status: 'Assigned', assignedTo: uid, assignedName: emp.name});
                                                            }}>
                                                                <option value="">Assign to...</option>
                                                                {allUsers.map(u=><option key={u.id} value={u.id}>{u.name}</option>)}
                                                            </select>
                                                        ) : (
                                                            <div className="flex items-center gap-2 text-xs font-medium">
                                                                {a.assignedName} 
                                                                <button onClick={()=>onAssignAsset(a.id, {status: 'Available', assignedTo: null, assignedName: ''})} className="text-[#a4262c] hover:underline">Revoke</button>
                                                            </div>
                                                        )}
                                                    </td>
                                                    <td className="px-4 py-3 text-right"><button onClick={()=>onDeleteAsset(a.id)} className="text-[#a4262c] text-xs font-semibold hover:underline"><Lucide.Trash2 size={16}/></button></td>
                                                </tr>
                                            ))}
                                            {assets.length === 0 && <tr><td colSpan="5" className="text-center py-6 text-[#605e5c]">No assets recorded.</td></tr>}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        ) : (
                            <div className="md:col-span-2 bg-white rounded shadow-sm border border-[#edebe9] p-6">
                                <h3 className="font-semibold text-[#323130] border-b border-[#edebe9] pb-3 mb-4">My Assigned Assets</h3>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    {myAssets.map(a => (
                                        <div key={a.id} className="border border-[#edebe9] rounded p-4 flex items-start gap-4 hover:border-[#0078d4] transition-colors">
                                            <div className="p-3 bg-[#eff6fc] text-[#0078d4] rounded-full"><Lucide.MonitorSmartphone size={24}/></div>
                                            <div>
                                                <h4 className="font-semibold text-[#323130]">{a.name}</h4>
                                                <p className="text-xs text-[#605e5c] uppercase tracking-wider mb-1">{a.type}</p>
                                                <p className="text-xs font-mono text-[#605e5c] bg-[#f3f2f1] px-2 py-0.5 rounded inline-block border border-[#edebe9]">SN: {a.serialNumber}</p>
                                            </div>
                                        </div>
                                    ))}
                                    {myAssets.length === 0 && <div className="col-span-3 py-10 text-center text-[#605e5c] border border-dashed border-[#edebe9] rounded">You have no assets assigned to you currently.</div>}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const ExpensesModule = ({ user, expenses, onSubmitExpense, onUpdateExpense }) => {
            const [title, setTitle] = useState('');
            const [amount, setAmount] = useState('');
            const [category, setCategory] = useState('Travel');

            const handleSubmit = (e) => {
                e.preventDefault();
                if(!title || !amount) return;
                onSubmitExpense({ title, amount: parseFloat(amount), category, status: 'Pending', userId: user.uid, userName: user.name, date: new Date().toLocaleDateString(), timestamp: serverTimestamp() });
                setTitle(''); setAmount('');
            };

            const myExpenses = expenses.filter(ex => ex.userId === user.uid);
            const adminPending = expenses.filter(ex => ex.status === 'Pending');

            return (
                <div className="space-y-6 pb-20 animate-fade-in">
                    <header><h2 className="text-2xl font-semibold text-[#323130]">Expense Claims</h2></header>
                    
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="bg-white p-6 rounded shadow-sm border border-[#edebe9]">
                            <h3 className="font-semibold text-[#323130] mb-4">Submit New Claim</h3>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div>
                                    <label className="text-xs font-semibold text-[#605e5c]">Description</label>
                                    <input type="text" className="w-full border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4] mt-1" value={title} onChange={e=>setTitle(e.target.value)} required />
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="text-xs font-semibold text-[#605e5c]">Amount (₹)</label>
                                        <input type="number" className="w-full border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4] mt-1" value={amount} onChange={e=>setAmount(e.target.value)} required />
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-[#605e5c]">Category</label>
                                        <select className="w-full border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4] mt-1 bg-white" value={category} onChange={e=>setCategory(e.target.value)}>
                                            <option>Travel</option><option>Meals</option><option>Office Supplies</option><option>Other</option>
                                        </select>
                                    </div>
                                </div>
                                <button className="w-full bg-[#0078d4] text-white py-2 rounded font-semibold hover:bg-[#106ebe] shadow-sm mt-2">Submit Claim</button>
                            </form>
                        </div>

                        <div className="lg:col-span-2 space-y-6">
                            {user.role === 'Admin' && adminPending.length > 0 && (
                                <div className="bg-white rounded shadow-sm border border-[#fde7e9] overflow-hidden">
                                    <div className="p-4 bg-[#fde7e9] text-[#a4262c] font-semibold border-b border-[#fbd3d6] flex justify-between items-center">
                                        <span>Action Required: Pending Approvals</span>
                                        <span className="bg-[#a4262c] text-white px-2 py-0.5 rounded text-xs">{adminPending.length}</span>
                                    </div>
                                    <div className="p-4 space-y-3">
                                        {adminPending.map(ex => (
                                            <div key={ex.id} className="flex justify-between items-center p-3 border border-[#edebe9] rounded bg-[#faf9f8]">
                                                <div>
                                                    <p className="font-semibold text-[#323130]">{ex.title} <span className="font-normal text-[#605e5c] text-sm ml-2">by {ex.userName}</span></p>
                                                    <p className="text-xs text-[#605e5c] mt-0.5">{ex.category} &bull; {ex.date}</p>
                                                </div>
                                                <div className="flex items-center gap-4">
                                                    <span className="font-bold text-lg text-[#323130]">₹{ex.amount}</span>
                                                    <div className="flex gap-2">
                                                        <button onClick={()=>onUpdateExpense(ex.id, {status: 'Approved'})} className="p-2 bg-[#dff6dd] text-[#107c10] rounded hover:bg-[#c3f1c0]"><Lucide.Check size={18}/></button>
                                                        <button onClick={()=>onUpdateExpense(ex.id, {status: 'Rejected'})} className="p-2 bg-[#fde7e9] text-[#a4262c] rounded hover:bg-[#fbd3d6]"><Lucide.X size={18}/></button>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            <div className="bg-white rounded shadow-sm border border-[#edebe9] overflow-hidden">
                                <div className="p-4 bg-[#f3f2f1] border-b border-[#edebe9] font-semibold text-[#323130]">My Expense History</div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-sm text-left">
                                        <thead className="bg-[#faf9f8] text-[#605e5c] text-xs uppercase">
                                            <tr><th className="px-4 py-3">Date</th><th className="px-4 py-3">Description</th><th className="px-4 py-3">Category</th><th className="px-4 py-3">Amount</th><th className="px-4 py-3">Status</th></tr>
                                        </thead>
                                        <tbody className="divide-y divide-[#edebe9]">
                                            {myExpenses.map(ex => (
                                                <tr key={ex.id} className="hover:bg-[#faf9f8]">
                                                    <td className="px-4 py-3 text-xs text-[#605e5c]">{ex.date}</td>
                                                    <td className="px-4 py-3 font-medium text-[#323130]">{ex.title}</td>
                                                    <td className="px-4 py-3 text-xs text-[#605e5c]">{ex.category}</td>
                                                    <td className="px-4 py-3 font-semibold text-[#323130]">₹{ex.amount}</td>
                                                    <td className="px-4 py-3">
                                                        <span className={`px-2 py-1 rounded text-xs font-semibold ${ex.status==='Pending'?'bg-[#fff4ce] text-[#795c00]': ex.status==='Approved' ? 'bg-[#dff6dd] text-[#107c10]' : 'bg-[#fde7e9] text-[#a4262c]'}`}>{ex.status}</span>
                                                    </td>
                                                </tr>
                                            ))}
                                            {myExpenses.length === 0 && <tr><td colSpan="5" className="text-center py-6 text-[#605e5c]">No expenses filed yet.</td></tr>}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const OKRModule = ({ user, okrs, onSubmitOKR, onUpdateProgress, onDeleteOKR }) => {
            const [objective, setObjective] = useState('');
            const [quarter, setQuarter] = useState('Q3-2026');

            const handleSubmit = (e) => {
                e.preventDefault();
                if(!objective) return;
                onSubmitOKR({ objective, progress: 0, quarter, userId: user.uid, userName: user.name, timestamp: serverTimestamp() });
                setObjective('');
            };

            const displayOKRs = user.role === 'Admin' ? okrs : okrs.filter(o => o.userId === user.uid);

            return (
                <div className="space-y-6 pb-20 animate-fade-in">
                    <header>
                        <h2 className="text-2xl font-semibold text-[#323130]">Objectives & Key Results (OKRs)</h2>
                        <p className="text-[#605e5c] text-sm">Align individual goals with company vision.</p>
                    </header>

                    <div className="bg-white p-6 rounded shadow-sm border border-[#edebe9]">
                        <form onSubmit={handleSubmit} className="flex flex-col md:flex-row gap-4 items-end">
                            <div className="flex-1 w-full">
                                <label className="text-xs font-semibold text-[#605e5c]">New Objective</label>
                                <input type="text" className="w-full border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4] mt-1" placeholder="e.g. Increase customer retention by 15%" value={objective} onChange={e=>setObjective(e.target.value)} required />
                            </div>
                            <div className="w-full md:w-48">
                                <label className="text-xs font-semibold text-[#605e5c]">Timeline</label>
                                <select className="w-full border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4] mt-1 bg-white" value={quarter} onChange={e=>setQuarter(e.target.value)}>
                                    <option>Q1-2026</option><option>Q2-2026</option><option>Q3-2026</option><option>Q4-2026</option>
                                </select>
                            </div>
                            <button className="w-full md:w-auto bg-[#107c10] text-white px-6 py-2 rounded font-semibold hover:bg-[#0b5a0b] shadow-sm">Set Goal</button>
                        </form>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {displayOKRs.map(okr => (
                            <div key={okr.id} className="bg-white p-5 rounded shadow-sm border border-[#edebe9] hover:border-[#c8c6c4] transition-colors relative">
                                {(user.role === 'Admin' || okr.userId === user.uid) && (
                                    <button onClick={()=>onDeleteOKR(okr.id)} className="absolute top-4 right-4 text-[#a19f9d] hover:text-[#a4262c]"><Lucide.Trash2 size={16}/></button>
                                )}
                                <div className="flex items-center gap-2 mb-2">
                                    <span className="px-2 py-0.5 bg-[#f3f2f1] text-[#605e5c] text-xs font-semibold rounded">{okr.quarter}</span>
                                    {user.role === 'Admin' && <span className="text-xs text-[#0078d4] font-semibold">{okr.userName}</span>}
                                </div>
                                <h3 className="font-semibold text-lg text-[#323130] pr-6 mb-4">{okr.objective}</h3>
                                
                                <div>
                                    <div className="flex justify-between text-xs font-semibold text-[#605e5c] mb-1">
                                        <span>Progress</span>
                                        <span className={okr.progress === 100 ? 'text-[#107c10]' : 'text-[#0078d4]'}>{okr.progress}%</span>
                                    </div>
                                    {okr.userId === user.uid ? (
                                        <input 
                                            type="range" min="0" max="100" step="5" value={okr.progress}
                                            onChange={(e)=>onUpdateProgress(okr.id, parseInt(e.target.value))}
                                        />
                                    ) : (
                                        <div className="w-full bg-[#f3f2f1] rounded h-2 border border-[#edebe9]">
                                            <div className="bg-[#0078d4] h-2 rounded transition-all duration-300" style={{width: `${okr.progress}%`}}></div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        ))}
                        {displayOKRs.length === 0 && <div className="col-span-full text-center py-10 text-[#605e5c]">No objectives set yet.</div>}
                    </div>
                </div>
            );
        };

        const VaultModule = ({ user, documents, onAddDocument, onDeleteDocument }) => {
            const [title, setTitle] = useState('');
            const [link, setLink] = useState('');
            const [category, setCategory] = useState('Policy');

            const handleSubmit = (e) => {
                e.preventDefault();
                if(!title || !link) return;
                onAddDocument({ title, link, category, uploadedBy: user.name, timestamp: serverTimestamp() });
                setTitle(''); setLink('');
            };

            const getIcon = (cat) => {
                if(cat==='Policy') return <Lucide.ShieldCheck size={24} className="text-[#a4262c]" />;
                if(cat==='Template') return <Lucide.FileText size={24} className="text-[#0078d4]" />;
                return <Lucide.BookOpen size={24} className="text-[#107c10]" />;
            };

            return (
                <div className="space-y-6 pb-20 animate-fade-in">
                    <header>
                        <h2 className="text-2xl font-semibold text-[#323130]">Document Vault</h2>
                        <p className="text-[#605e5c] text-sm">Centralized company resources and policies.</p>
                    </header>

                    {user.role === 'Admin' && (
                        <div className="bg-white p-6 rounded shadow-sm border border-[#edebe9]">
                            <h3 className="font-semibold text-[#323130] mb-4">Publish Document Link</h3>
                            <form onSubmit={handleSubmit} className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                <input type="text" className="border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4]" placeholder="Document Title" value={title} onChange={e=>setTitle(e.target.value)} required />
                                <select className="border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4] bg-white" value={category} onChange={e=>setCategory(e.target.value)}>
                                    <option>Policy</option><option>Template</option><option>Guide</option>
                                </select>
                                <input type="url" className="border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4]" placeholder="URL (Google Drive, Sharepoint...)" value={link} onChange={e=>setLink(e.target.value)} required />
                                <button className="bg-[#0078d4] text-white py-2 rounded font-semibold hover:bg-[#106ebe] shadow-sm">Publish Link</button>
                            </form>
                        </div>
                    )}

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {documents.map(doc => (
                            <a key={doc.id} href={doc.link} target="_blank" rel="noopener noreferrer" className="block bg-white p-5 rounded shadow-sm border border-[#edebe9] hover:border-[#0078d4] hover:shadow-md transition-all group relative">
                                {user.role === 'Admin' && (
                                    <button onClick={(e)=>{e.preventDefault(); onDeleteDocument(doc.id);}} className="absolute top-4 right-4 text-[#a19f9d] hover:text-[#a4262c]"><Lucide.Trash2 size={16}/></button>
                                )}
                                <div className="flex items-center gap-4 mb-3">
                                    <div className="p-3 bg-[#f3f2f1] rounded-lg border border-[#edebe9] group-hover:bg-[#eff6fc] transition-colors">{getIcon(doc.category)}</div>
                                    <div>
                                        <p className="text-xs font-semibold text-[#605e5c] uppercase tracking-wider">{doc.category}</p>
                                        <h3 className="font-semibold text-[#323130] group-hover:text-[#0078d4] transition-colors line-clamp-1">{doc.title}</h3>
                                    </div>
                                </div>
                                <div className="flex justify-between items-center text-xs text-[#605e5c] border-t border-[#edebe9] pt-3 mt-3">
                                    <span>By {doc.uploadedBy}</span>
                                    <span className="flex items-center gap-1">Open <Lucide.ExternalLink size={12}/></span>
                                </div>
                            </a>
                        ))}
                        {documents.length === 0 && <div className="col-span-full py-10 text-center text-[#605e5c]">No documents in the vault.</div>}
                    </div>
                </div>
            );
        };

        // NEW ADVANCED FEATURE: CRM MODULE
        const CRMModule = ({ user, clients, onAddClient, onUpdateClient, onDeleteClient }) => {
            const [name, setName] = useState('');
            const [company, setCompany] = useState('');
            const [phone, setPhone] = useState('');
            const [email, setEmail] = useState('');
            const [status, setStatus] = useState('Lead');
            const [selectedClient, setSelectedClient] = useState(null);
            const [note, setNote] = useState('');

            const handleAdd = (e) => {
                e.preventDefault();
                if(!name || !phone) return;
                onAddClient({ name, company, phone, email, status, addedBy: user.name, logs: [], timestamp: serverTimestamp() });
                setName(''); setCompany(''); setPhone(''); setEmail('');
            };

            const handleAddNote = (e, clientId, logs) => {
                e.preventDefault();
                if(!note) return;
                const updatedLogs = [...(logs || []), { text: note, date: new Date().toLocaleString(), by: user.name }];
                onUpdateClient(clientId, { logs: updatedLogs });
                setNote('');
            };

            return (
                <div className="space-y-6 pb-20 animate-fade-in">
                    <header>
                        <h2 className="text-2xl font-semibold text-[#323130]">Client Relationship Management (CRM)</h2>
                        <p className="text-[#605e5c] text-sm">Manage client details, leads, and call logs securely.</p>
                    </header>

                    <div className="bg-white p-6 rounded shadow-sm border border-[#edebe9]">
                        <h3 className="font-semibold text-[#323130] mb-4">Add New Client/Lead</h3>
                        <form onSubmit={handleAdd} className="grid grid-cols-1 md:grid-cols-5 gap-4">
                            <input type="text" className="border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4]" placeholder="Client Name" value={name} onChange={e=>setName(e.target.value)} required />
                            <input type="text" className="border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4]" placeholder="Company Name" value={company} onChange={e=>setCompany(e.target.value)} />
                            <input type="tel" className="border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4]" placeholder="Phone Number" value={phone} onChange={e=>setPhone(e.target.value)} required />
                            <input type="email" className="border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4]" placeholder="Email Address" value={email} onChange={e=>setEmail(e.target.value)} />
                            <select className="border border-[#8a8886] p-2 rounded focus:ring-2 focus:ring-[#0078d4] bg-white" value={status} onChange={e=>setStatus(e.target.value)}>
                                <option>Lead</option><option>Active Client</option><option>Inactive</option>
                            </select>
                            <div className="md:col-span-5"><button className="bg-[#0078d4] text-white px-6 py-2 rounded font-semibold hover:bg-[#106ebe] shadow-sm">Save Client</button></div>
                        </form>
                    </div>

                    <div className="grid grid-cols-1 gap-4">
                        {clients.map(client => (
                            <div key={client.id} className="bg-white rounded shadow-sm border border-[#edebe9] overflow-hidden">
                                <div className="p-4 flex flex-col md:flex-row justify-between md:items-center gap-4 hover:bg-[#faf9f8] cursor-pointer" onClick={() => setSelectedClient(selectedClient === client.id ? null : client.id)}>
                                    <div className="flex items-center gap-4">
                                        <div className="w-10 h-10 rounded-full bg-[#eff6fc] text-[#0078d4] flex items-center justify-center font-bold flex-shrink-0">{client.name.charAt(0)}</div>
                                        <div>
                                            <h4 className="font-semibold text-[#323130] text-lg">{client.name} {client.company && <span className="text-sm font-normal text-[#605e5c]">({client.company})</span>}</h4>
                                            <div className="flex flex-wrap gap-3 text-xs text-[#605e5c] mt-1">
                                                <span className="flex items-center gap-1"><Lucide.Phone size={12}/> {client.phone}</span>
                                                {client.email && <span className="flex items-center gap-1"><Lucide.Mail size={12}/> {client.email}</span>}
                                            </div>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-4">
                                        <select 
                                            className={`text-xs font-semibold px-2 py-1 rounded border outline-none ${client.status === 'Active Client' ? 'bg-[#dff6dd] text-[#107c10] border-[#c3f1c0]' : client.status === 'Lead' ? 'bg-[#fff4ce] text-[#795c00] border-[#ffe78c]' : 'bg-[#f3f2f1] text-[#605e5c] border-[#edebe9]'}`}
                                            value={client.status}
                                            onChange={(e) => { e.stopPropagation(); onUpdateClient(client.id, {status: e.target.value}); }}
                                        >
                                            <option value="Lead">Lead</option><option value="Active Client">Active Client</option><option value="Inactive">Inactive</option>
                                        </select>
                                        {(user.role === 'Admin' || user.email === CRM_EMAIL) && (
                                            <button onClick={(e)=>{ e.stopPropagation(); if(confirm('Delete client?')) onDeleteClient(client.id); }} className="text-[#a19f9d] hover:text-[#a4262c]"><Lucide.Trash2 size={16}/></button>
                                        )}
                                        <Lucide.ChevronDown size={20} className={`text-[#605e5c] transition-transform ${selectedClient === client.id ? 'rotate-180' : ''}`} />
                                    </div>
                                </div>
                                
                                {selectedClient === client.id && (
                                    <div className="p-4 border-t border-[#edebe9] bg-[#faf9f8] animate-fade-in">
                                        <h5 className="text-sm font-semibold text-[#323130] mb-3 flex items-center gap-2"><Lucide.History size={16}/> Call Logs & Notes</h5>
                                        <div className="space-y-3 mb-4 max-h-[200px] overflow-y-auto custom-scrollbar">
                                            {(client.logs || []).map((log, i) => (
                                                <div key={i} className="bg-white p-3 rounded border border-[#edebe9] text-sm">
                                                    <p className="text-[#323130]">{log.text}</p>
                                                    <p className="text-xs text-[#605e5c] mt-1">{log.date} by {log.by}</p>
                                                </div>
                                            ))}
                                            {(!client.logs || client.logs.length === 0) && <p className="text-xs text-[#605e5c]">No communication logs added yet.</p>}
                                        </div>
                                        <form onSubmit={(e) => handleAddNote(e, client.id, client.logs)} className="flex gap-2">
                                            <input type="text" className="flex-1 border border-[#8a8886] p-2 rounded text-sm focus:ring-2 focus:ring-[#0078d4]" placeholder="Type a note or call summary..." value={note} onChange={e=>setNote(e.target.value)} />
                                            <button className="bg-[#107c10] text-white px-4 py-2 rounded text-sm font-semibold hover:bg-[#0b5a0b] flex items-center gap-2"><Lucide.Plus size={16}/> Add Note</button>
                                        </form>
                                    </div>
                                )}
                            </div>
                        ))}
                        {clients.length === 0 && <div className="text-center py-10 text-[#605e5c] bg-white rounded shadow-sm border border-[#edebe9]">No clients in the CRM. Add one above.</div>}
                    </div>
                </div>
            );
        };

        const App = () => {
            if (!isConfigured) return <ConfigErrorScreen />;

            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null);
            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [sidebarOpen, setSidebarOpen] = useState(false);
            
            // Standard Data Arrays
            const [attendanceLogs, setAttendanceLogs] = useState([]);
            const [tasks, setTasks] = useState([]);
            const [leaves, setLeaves] = useState([]);
            const [reports, setReports] = useState([]);
            const [allUsers, setAllUsers] = useState([]);
            const [messages, setMessages] = useState([]);
            const [ideas, setIdeas] = useState([]);
            const [announcements, setAnnouncements] = useState([]);
            const [tickets, setTickets] = useState([]);

            // Advanced Data Arrays
            const [assets, setAssets] = useState([]);
            const [expenses, setExpenses] = useState([]);
            const [okrs, setOkrs] = useState([]);
            const [documents, setDocuments] = useState([]);
            const [meetings, setMeetings] = useState([]);
            const [trainings, setTrainings] = useState([]);
            const [clients, setClients] = useState([]);

            // Persistent Login
            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, async (u) => {
                    if (u) { 
                        setUser(u);
                        try {
                            const q = query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'users'), where("uid", "==", u.uid));
                            const snapshot = await getDocs(q);
                            if (!snapshot.empty) {
                                setProfile({ ...snapshot.docs[0].data(), docId: snapshot.docs[0].id });
                            }
                        } catch (e) { console.error("Profile fetch error", e); }
                    } else { setUser(null); setProfile(null); }
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            // Data Sync & Logic
            useEffect(() => {
                if (!user || !profile) return;
                
                const unsub1 = onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', 'attendance'), s => setAttendanceLogs(s.docs.map(d => ({id: d.id, ...d.data()}))));
                
                const unsub2 = onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', 'tasks'), s => {
                    const taskList = s.docs.map(d => ({id: d.id, ...d.data()}));
                    setTasks(taskList);
                    if (profile.role === 'Admin') {
                        const now = Date.now();
                        taskList.forEach(task => {
                            if (task.status === 'done' && task.completedAt) {
                                const completedTime = task.completedAt.toDate ? task.completedAt.toDate().getTime() : Date.now();
                                if (now - completedTime > 24 * 60 * 60 * 1000) { deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'tasks', task.id)); }
                            }
                        });
                    }
                });

                const unsub3 = onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', 'leaves'), s => setLeaves(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsub4 = onSnapshot(query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'daily_reports'), orderBy('timestamp', 'desc')), s => setReports(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsub5 = onSnapshot(query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'messages'), orderBy('timestamp', 'asc')), s => {
                    const newMessages = s.docs.map(d => ({id: d.id, ...d.data()}));
                    setMessages(newMessages);
                    if (!s.empty) {
                        const lastMsg = newMessages[newMessages.length - 1];
                        const now = new Date();
                        const msgTime = lastMsg.timestamp?.toDate ? lastMsg.timestamp.toDate() : new Date();
                        if (lastMsg.userId !== user.uid && (now - msgTime) < 10000 && s.docChanges().some(c => c.type === 'added' && c.doc.id === lastMsg.id)) {
                            sendNotification(`New Message from ${lastMsg.userName}`, lastMsg.type === 'pdf' ? 'Shared a PDF File' : lastMsg.text);
                        }
                    }
                });
                const unsub7 = onSnapshot(query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'ideas'), orderBy('timestamp', 'desc')), s => setIdeas(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsub8 = onSnapshot(query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'notices'), orderBy('timestamp', 'desc')), s => setAnnouncements(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsub9 = onSnapshot(query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'tickets'), orderBy('timestamp', 'desc')), s => setTickets(s.docs.map(d => ({id: d.id, ...d.data()}))));

                // Advanced Features Subscriptions
                const unsub10 = onSnapshot(query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'assets'), orderBy('addedAt', 'desc')), s => setAssets(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsub11 = onSnapshot(query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'expenses'), orderBy('timestamp', 'desc')), s => setExpenses(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsub12 = onSnapshot(query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'okrs'), orderBy('timestamp', 'desc')), s => setOkrs(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsub13 = onSnapshot(query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'documents'), orderBy('timestamp', 'desc')), s => setDocuments(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsub14 = onSnapshot(query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'meetings'), orderBy('timestamp', 'desc')), s => setMeetings(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsub15 = onSnapshot(query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'trainings'), orderBy('timestamp', 'desc')), s => setTrainings(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsub16 = onSnapshot(query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'clients'), orderBy('timestamp', 'desc')), s => setClients(s.docs.map(d => ({id: d.id, ...d.data()}))));

                let unsub6 = () => {};
                if (profile.role === 'Admin') {
                    unsub6 = onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', 'users'), s => setAllUsers(s.docs.map(d => ({id: d.id, ...d.data()}))));
                } else {
                    setAllUsers([]);
                }
                
                return () => { unsub1(); unsub2(); unsub3(); unsub4(); unsub5(); unsub6(); unsub7(); unsub8(); unsub9(); unsub10(); unsub11(); unsub12(); unsub13(); unsub14(); unsub15(); unsub16(); };
            }, [user, profile]);

            const handleLogout = async () => { await signOut(auth); setProfile(null); };

            if (loading) return <LoadingScreen />;
            if (!user || !profile) return <LoginScreen onJoin={setProfile} />;

            const NavItem = ({ id, icon: Icon, label }) => (
                <button onClick={() => { setActiveTab(id); setSidebarOpen(false); }} className={`w-full flex items-center gap-3 px-4 py-2.5 rounded transition-all font-semibold text-sm ${activeTab === id ? 'bg-white text-[#0078d4] border-l-4 border-[#0078d4] shadow-sm' : 'text-[#323130] hover:bg-[#edebe9]'}`}>
                    <Icon size={18} /> <span>{label}</span>
                </button>
            );

            return (
                <div className="h-screen bg-[#faf9f8] flex overflow-hidden">
                    {sidebarOpen && <div className="fixed inset-0 bg-black/40 z-40 lg:hidden" onClick={() => setSidebarOpen(false)} />}
                    <aside className={`fixed lg:static inset-y-0 left-0 z-50 w-72 bg-[#f3f2f1] text-[#323130] border-r border-[#edebe9] flex flex-col transition-transform duration-300 shadow-xl lg:shadow-none ${sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'}`}>
                        <div className="p-6 pb-4">
                            <div className="flex items-center gap-3 mb-6">
                                <div className="bg-white p-1 rounded border border-[#edebe9] shadow-sm"><img src={LOGO_URL} alt="Logo" className="w-8 h-8 object-contain" /></div>
                                <div><h1 className="font-semibold text-lg tracking-tight">Varun Dynamics</h1><p className="text-xs text-[#605e5c]">Enterprise System</p></div>
                            </div>
                            <div className="bg-white p-3 rounded flex items-center gap-3 border border-[#edebe9] shadow-sm">
                                <div className="w-10 h-10 rounded-full bg-[#f3f2f1] flex items-center justify-center font-semibold text-[#323130] overflow-hidden border border-[#edebe9]">
                                    {profile.photoURL ? <img src={profile.photoURL} className="w-full h-full object-cover"/> : profile.name.charAt(0)}
                                </div>
                                <div className="overflow-hidden"><p className="font-semibold text-sm truncate">{profile.name}</p><p className="text-xs text-[#605e5c] truncate">{profile.role}</p></div>
                            </div>
                        </div>
                        <nav className="flex-1 px-4 space-y-1 overflow-y-auto custom-scrollbar pb-6">
                            <p className="px-4 text-xs font-semibold text-[#605e5c] uppercase tracking-wider mb-2 mt-2">Workspace</p>
                            <NavItem id="dashboard" icon={Lucide.LayoutDashboard} label="Dashboard" />
                            <NavItem id="meetings" icon={Lucide.CalendarClock} label="Meetings" />
                            <NavItem id="notices" icon={Lucide.Megaphone} label="Notice Board" />
                            <NavItem id="vault" icon={Lucide.FolderLock} label="Document Vault" />
                            
                            <p className="px-4 text-xs font-semibold text-[#605e5c] uppercase tracking-wider mb-2 mt-6">Productivity</p>
                            <NavItem id="attendance" icon={Lucide.Clock} label="Attendance" />
                            <NavItem id="tasks" icon={Lucide.CheckSquare} label="Task Board" />
                            <NavItem id="okrs" icon={Lucide.Target} label="Objectives (OKRs)" />
                            <NavItem id="eod" icon={Lucide.FileText} label="Daily Reports" />
                            <NavItem id="leaves" icon={Lucide.CalendarDays} label="Leaves" />
                            
                            <p className="px-4 text-xs font-semibold text-[#605e5c] uppercase tracking-wider mb-2 mt-6">Collaboration</p>
                            <NavItem id="chat" icon={Lucide.MessageSquare} label="Group Chat" />
                            <NavItem id="ideas" icon={Lucide.Lightbulb} label="Idea Hub" />
                            <NavItem id="training" icon={Lucide.GraduationCap} label="Learning Hub" />
                            <NavItem id="progress" icon={Lucide.BarChart2} label="My Progress" />
                            
                            <p className="px-4 text-xs font-semibold text-[#605e5c] uppercase tracking-wider mb-2 mt-6">Support & Ops</p>
                            <NavItem id="expenses" icon={Lucide.Receipt} label="Expenses" />
                            <NavItem id="assets" icon={Lucide.MonitorSmartphone} label="My Assets" />
                            <NavItem id="payroll" icon={Lucide.Wallet} label="Payroll" />
                            <NavItem id="helpdesk" icon={Lucide.LifeBuoy} label="Help Desk" />
                            
                            {(profile.role === 'Admin' || profile.email === CRM_EMAIL) && (
                                <>
                                    <p className="px-4 text-xs font-semibold text-[#605e5c] uppercase tracking-wider mb-2 mt-6">Sales & Clients</p>
                                    <NavItem id="crm" icon={Lucide.Briefcase} label="CRM Dashboard" />
                                </>
                            )}
                            
                            {profile.role === 'Admin' && (
                                <>
                                    <p className="px-4 text-xs font-semibold text-[#605e5c] uppercase tracking-wider mb-2 mt-6">Admin Panel</p>
                                    <NavItem id="users" icon={Lucide.Users} label="User Management" />
                                    <NavItem id="payroll-manager" icon={Lucide.DollarSign} label="Payroll Manager" />
                                </>
                            )}
                        </nav>
                        <div className="p-4 bg-white border-t border-[#edebe9]"><button onClick={handleLogout} className="w-full flex items-center justify-center gap-2 text-[#a4262c] hover:bg-[#fde7e9] py-2 rounded text-sm font-semibold transition-all"><Lucide.LogOut size={16} /> Sign Out</button></div>
                    </aside>

                    <main className="flex-1 flex flex-col h-screen overflow-hidden relative">
                        <header className="bg-white border-b border-[#edebe9] p-4 flex items-center justify-between lg:hidden shadow-sm z-30 sticky top-0">
                            <button onClick={() => setSidebarOpen(true)} className="text-[#323130] p-2 hover:bg-[#f3f2f1] rounded"><Lucide.Menu size={24} /></button>
                            <span className="font-semibold text-[#323130]">Varun Dynamics</span>
                            <div className="w-8" />
                        </header>
                        <div className="flex-1 overflow-auto p-4 lg:p-8 relative">
                            <div className="max-w-6xl mx-auto h-full">
                                {activeTab === 'dashboard' && <Dashboard user={{...profile, uid: user.uid}} attendanceLogs={attendanceLogs} tasks={tasks} leaves={leaves} reports={reports} announcements={announcements} setActiveTab={setActiveTab} onMarkAttendance={(type) => addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'attendance'), { userId: user.uid, userName: profile.name, location: profile.location, type, timestamp: serverTimestamp() })} />}
                                {activeTab === 'users' && profile.role === 'Admin' && <AdminUserManagement allUsers={allUsers} onAddUser={(data) => addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'users'), data)} onDeleteUser={(id) => deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'users', id))} />}
                                {activeTab === 'payroll-manager' && profile.role === 'Admin' && <AdminPayrollManager users={allUsers} onUpdateSalary={(uid, salaryConfig) => updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'users', uid), { salaryConfig })} />}
                                {activeTab === 'attendance' && <AttendanceModule user={{...profile, uid: user.uid}} allUsers={allUsers} attendanceLogs={attendanceLogs} onMarkAttendance={(type) => addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'attendance'), { userId: user.uid, userName: profile.name, location: profile.location, type, timestamp: serverTimestamp() })} />}
                                {activeTab === 'tasks' && <TaskBoard user={{...profile, uid: user.uid}} tasks={tasks} onAddTask={(data) => addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'tasks'), data)} onUpdateTaskStatus={(id, status) => updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'tasks', id), status)} onDeleteTask={(id) => deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'tasks', id))} />}
                                {activeTab === 'leaves' && <AvailabilityModule user={{...profile, uid: user.uid}} leaves={leaves} onAddLeave={(data) => addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'leaves'), data)} />}
                                {activeTab === 'eod' && <EODModule user={{...profile, uid: user.uid}} reports={reports} onSubmitReport={(data) => addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'daily_reports'), data)} />}
                                {activeTab === 'chat' && <ChatModule user={{...profile, uid: user.uid}} messages={messages} onSendMessage={(data) => addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'messages'), data)} />}
                                {activeTab === 'progress' && <ProgressModule user={{...profile, uid: user.uid}} tasks={tasks} attendanceLogs={attendanceLogs} reports={reports} />}
                                {activeTab === 'ideas' && <IdeaHubModule user={{...profile, uid: user.uid}} ideas={ideas} onSubmitIdea={(data) => addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'ideas'), data)} />}
                                {activeTab === 'payroll' && <PayrollModule user={{...profile, uid: user.uid}} />}
                                {activeTab === 'helpdesk' && <HelpDeskModule user={{...profile, uid: user.uid}} tickets={tickets} onRaiseTicket={(data) => addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'tickets'), data)} onUpdateStatus={(id, status) => updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'tickets', id), {status})} />}
                                {activeTab === 'notices' && <NoticesModule user={{...profile, uid: user.uid}} announcements={announcements} onPostNotice={(data) => addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'notices'), data)} onDeleteNotice={(id) => deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'notices', id))} />}
                                
                                {/* Advanced Modules */}
                                {activeTab === 'assets' && <AssetsModule user={{...profile, uid: user.uid}} assets={assets} allUsers={allUsers} onAddAsset={(d)=>addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'assets'), d)} onAssignAsset={(id, d)=>updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'assets', id), d)} onDeleteAsset={(id)=>deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'assets', id))} />}
                                {activeTab === 'expenses' && <ExpensesModule user={{...profile, uid: user.uid}} expenses={expenses} onSubmitExpense={(d)=>addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'expenses'), d)} onUpdateExpense={(id, d)=>updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'expenses', id), d)} />}
                                {activeTab === 'okrs' && <OKRModule user={{...profile, uid: user.uid}} okrs={okrs} onSubmitOKR={(d)=>addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'okrs'), d)} onUpdateProgress={(id, progress)=>updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'okrs', id), {progress})} onDeleteOKR={(id)=>deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'okrs', id))} />}
                                {activeTab === 'vault' && <VaultModule user={{...profile, uid: user.uid}} documents={documents} onAddDocument={(d)=>addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'documents'), d)} onDeleteDocument={(id)=>deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'documents', id))} />}
                                {activeTab === 'meetings' && <MeetingsModule user={{...profile, uid: user.uid}} meetings={meetings} onScheduleMeeting={(d)=>addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'meetings'), d)} onDeleteMeeting={(id)=>deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'meetings', id))} />}
                                {activeTab === 'training' && <TrainingModule user={{...profile, uid: user.uid}} trainings={trainings} onAddTraining={(d)=>addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'trainings'), d)} onMarkComplete={(id, completions)=>updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'trainings', id), {completions})} onDeleteTraining={(id)=>deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'trainings', id))} />}
                                {activeTab === 'crm' && <CRMModule user={{...profile, uid: user.uid}} clients={clients} onAddClient={(d)=>addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'clients'), d)} onUpdateClient={(id, d)=>updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'clients', id), d)} onDeleteClient={(id)=>deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'clients', id))} />}
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
